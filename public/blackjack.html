<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack — Obsidian Casino</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<script src="/casino-core.js"></script>
<script>Casino.renderSidebar('blackjack');Casino.requireAuth();</script>

<main class="casino-main">

  <!-- SETUP SCREEN -->
  <div id="setupScreen">
    <div class="bj-setup-wrap">
      <div class="bj-setup-card">
        <div style="text-align:center;margin-bottom:24px">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin-bottom:12px">
            <rect x="4" y="3" width="22" height="32" rx="3" fill="white" opacity="0.95"/>
            <text x="8" y="16" font-size="10" font-weight="900" fill="#111" font-family="Georgia,serif">A</text>
            <text x="15" y="26" font-size="14" text-anchor="middle" fill="#111" font-family="Georgia,serif">â™ </text>
            <rect x="22" y="11" width="22" height="32" rx="3" fill="white" opacity="0.9"/>
            <text x="26" y="24" font-size="10" font-weight="900" fill="#c62828" font-family="Georgia,serif">K</text>
            <text x="33" y="34" font-size="14" text-anchor="middle" fill="#c62828" font-family="Georgia,serif">â™¥</text>
          </svg>
          <div style="font-size:1.4rem;font-weight:900;letter-spacing:2px">BLACKJACK</div>
          <div style="font-size:0.8rem;color:var(--text3);margin-top:4px">Multiplayer Â· Up to 6 players</div>
        </div>

        <div class="tab-row">
          <button class="tab-btn active" onclick="showTab('create',this)">Create Table</button>
          <button class="tab-btn" onclick="showTab('join',this)">Join Table</button>
        </div>

        <div id="createTab">
          <input class="form-input" id="createName" placeholder="Your name" maxlength="15">
          <button class="btn-primary" onclick="createRoom()">CREATE TABLE</button>
        </div>
        <div id="joinTab" style="display:none">
          <input class="form-input" id="joinName" placeholder="Your name" maxlength="15">
          <input class="form-input" id="joinCode" placeholder="Room code" maxlength="6" style="text-transform:uppercase;font-weight:800;letter-spacing:4px;text-align:center">
          <button class="btn-primary" onclick="joinRoom()">JOIN TABLE</button>
        </div>
        <div class="bj-error" id="errorMsg"></div>
      </div>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen" style="display:none">
    <div style="padding:20px">
      <div class="bj-lobby-card">
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:0.7rem;color:var(--text3);letter-spacing:3px;margin-bottom:8px">ROOM CODE</div>
          <div class="room-code-box" onclick="copyCode()">
            <div class="room-code-val" id="roomCodeDisplay">------</div>
            <div class="room-code-hint">Tap to copy Â· Share with friends</div>
          </div>
        </div>

        <div style="font-size:0.75rem;font-weight:700;color:var(--text3);letter-spacing:2px;margin-bottom:10px">PLAYERS</div>
        <div id="lobbyPlayerList" style="background:var(--bg3);border-radius:10px;margin-bottom:16px;overflow:hidden"></div>

        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn-secondary" id="readyBtn" onclick="toggleReady()">I'M READY</button>
          <button class="btn-primary" id="startBtn" onclick="startGame()" style="display:none">START GAME</button>
          <button class="btn-danger" onclick="leaveRoom()" style="background:transparent;border:1px solid var(--border2);color:var(--text2)">Leave Room</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" style="display:none">
    <div class="game-page">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;gap:8px;align-items:center">
          <span style="background:var(--bg3);border:1px solid var(--border);padding:4px 12px;border-radius:16px;font-size:0.75rem;font-weight:700;color:var(--text2)" id="gameRoomCodeBadge"></span>
          <span style="background:var(--bg3);border:1px solid var(--border);padding:4px 12px;border-radius:16px;font-size:0.75rem;font-weight:600;color:var(--text3)">Round <span id="roundBadge">1</span></span>
        </div>
      </div>

      <!-- TABLE FELT -->
      <div class="bj-table-felt" style="margin-bottom:14px">
        <div class="bj-dealer-zone">
          <div class="zone-label">DEALER</div>
          <div class="card-hand" id="dealerHand"></div>
          <div id="dealerScore"></div>
        </div>
        <div class="bj-other-zone" id="otherPlayers"></div>
        <div class="bj-center-zone">
          <div class="pot-badge">
            <div class="pb-label">POT</div>
            <div class="pb-amount" id="potAmt">$0</div>
          </div>
        </div>
        <div class="bj-message"><div class="bj-msg-text" id="bjMessage" style="display:none"></div></div>
        <div class="player-badge-row">
          <div class="player-badge-pill">
            <span class="pbp-name" id="pbpName">You</span>
            <span class="pbp-chips" id="pbpChips">$1000</span>
            <span class="pbp-bet" id="pbpBet">Bet: $0</span>
          </div>
        </div>
        <div class="bj-player-zone">
          <div class="card-hand" id="playerHand"></div>
          <div id="playerScore"></div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px">
        <!-- BETTING -->
        <div id="bettingPanel">
          <div style="font-size:0.7rem;font-weight:700;color:var(--text3);letter-spacing:2px;text-align:center;margin-bottom:10px" id="bettingTitle">PLACE YOUR BET</div>
          <div id="betInputRow" style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
            <div class="bet-input-wrap">
              <div class="bet-currency">$</div>
              <input type="number" id="betInput" value="100" min="10" step="10" style="width:80px">
            </div>
            <button class="bet-half" onclick="halveBet()">Â½</button>
            <button class="bet-double" onclick="doubleBet()">Ã—2</button>
          </div>
          <div class="bj-chips-row" id="chipsRow">
            <button class="bj-chip bj-c10" onclick="setBet(10)">10</button>
            <button class="bj-chip bj-c25" onclick="setBet(25)">25</button>
            <button class="bj-chip bj-c50" onclick="setBet(50)">50</button>
            <button class="bj-chip bj-c100" onclick="setBet(100)">100</button>
            <button class="bj-chip bj-c500" onclick="setBet(500)">500</button>
          </div>
          <button class="btn-primary" id="dealBtn" onclick="deal()" style="display:none;margin-top:8px">DEAL CARDS</button>
        </div>

        <!-- ACTION -->
        <div id="actionPanel" style="display:none">
          <div class="bj-action-row">
            <button class="bj-action-btn bj-hit" onclick="hit()">HIT</button>
            <button class="bj-action-btn bj-stand" onclick="stand()">STAND</button>
            <button class="bj-action-btn bj-double" id="dblBtn" onclick="doubleDown()">DOUBLE</button>
          </div>
        </div>

        <!-- END -->
        <div id="endPanel" style="display:none">
          <button class="btn-primary" id="nextRoundBtn" onclick="nextRound()">NEXT ROUND</button>
        </div>
      </div>

      <!-- PLAYER TABS -->
      <div class="bj-player-tabs" id="playerTabs" style="margin-top:12px"></div>

      <!-- SCOREBOARD toggle -->
      <div style="margin-top:12px">
        <button onclick="toggleScore()" style="background:var(--bg2);border:1px solid var(--border);color:var(--text3);padding:8px 16px;border-radius:8px;font-size:0.78rem;font-weight:600;width:100%;transition:background 0.2s" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='var(--bg2)'">
          Scoreboard
        </button>
        <div id="scoreboard" style="display:none;margin-top:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
          <table style="width:100%;border-collapse:collapse;font-size:0.82rem">
            <thead>
              <tr style="background:var(--bg3)">
                <th style="padding:10px;text-align:left;color:var(--text3);font-weight:700;font-size:0.7rem;letter-spacing:1px">PLAYER</th>
                <th style="padding:10px;text-align:center;color:var(--text3);font-weight:700;font-size:0.7rem">CHIPS</th>
                <th style="padding:10px;text-align:center;color:var(--text3);font-weight:700;font-size:0.7rem">W</th>
                <th style="padding:10px;text-align:center;color:var(--text3);font-weight:700;font-size:0.7rem">L</th>
                <th style="padding:10px;text-align:center;color:var(--text3);font-weight:700;font-size:0.7rem">P</th>
              </tr>
            </thead>
            <tbody id="scoreBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</main>

<script>
const socket = io();
let myId = null, myName = '', roomCode = '', gameState = null, scoreOpen = false;

socket.on('connect', () => { myId = socket.id; });

function showTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('createTab').style.display = tab === 'create' ? 'block' : 'none';
  document.getElementById('joinTab').style.display = tab === 'join' ? 'block' : 'none';
}

function showErr(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 3000);
}

function createRoom() {
  const name = document.getElementById('createName').value.trim();
  if (!name) { showErr('Enter your name'); return; }
  myName = name;
  socket.emit('createRoom', { name });
}

function joinRoom() {
  const name = document.getElementById('joinName').value.trim();
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (!name) { showErr('Enter your name'); return; }
  if (!code || code.length < 4) { showErr('Enter a valid room code'); return; }
  myName = name;
  socket.emit('joinRoom', { name, code });
}

socket.on('roomCreated', ({ code }) => {
  roomCode = code;
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('lobbyScreen').style.display = 'block';
  document.getElementById('roomCodeDisplay').textContent = code;
});

socket.on('joinError', msg => showErr(msg));
socket.on('gameError', msg => showErr(msg));

socket.on('roomUpdate', (state) => {
  gameState = state;
  if (state.phase === 'lobby') {
    showLobby(state);
  } else {
    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    renderGame(state);
  }
});

function showLobby(state) {
  document.getElementById('lobbyScreen').style.display = 'block';
  document.getElementById('gameScreen').style.display = 'none';
  const me = state.players.find(p => p.id === myId);
  const listEl = document.getElementById('lobbyPlayerList');
  listEl.innerHTML = state.players.map(p =>
    `<div class="lobby-player-row">
      <span class="lpr-name">${p.isHost ? 'ðŸ‘‘ ' : ''}${p.name}</span>
      <span class="lpr-chips" style="color:var(--text3);font-size:0.78rem">$${p.chips}</span>
      ${p.ready ? '<span class="lpr-ready">READY</span>' : '<span style="font-size:0.75rem;color:var(--text3)">waiting</span>'}
    </div>`
  ).join('');
  const readyBtn = document.getElementById('readyBtn');
  readyBtn.textContent = me?.ready ? 'NOT READY' : "I'M READY";
  readyBtn.style.background = me?.ready ? 'var(--bg4)' : '';
  document.getElementById('startBtn').style.display = me?.isHost ? 'block' : 'none';
}

function toggleReady() { socket.emit('readyToggle'); }
function startGame() { socket.emit('startGame'); }

function leaveRoom() {
  socket.emit('leaveRoom');
  document.getElementById('lobbyScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'block';
  roomCode = ''; gameState = null;
}

function copyCode() {
  navigator.clipboard.writeText(roomCode);
  const el = document.getElementById('roomCodeDisplay');
  const orig = el.textContent;
  el.textContent = 'COPIED!';
  setTimeout(() => { el.textContent = orig; }, 1000);
}

function renderGame(state) {
  document.getElementById('gameRoomCodeBadge').textContent = roomCode;
  document.getElementById('roundBadge').textContent = state.round;
  document.getElementById('potAmt').textContent = `$${state.pot}`;
  const me = state.players.find(p => p.id === myId);
  if (me) {
    document.getElementById('pbpName').textContent = me.name;
    document.getElementById('pbpChips').textContent = `$${me.chips}`;
    document.getElementById('pbpBet').textContent = `Bet: $${me.bet}`;
    const ph = document.getElementById('playerHand');
    ph.innerHTML = me.hand.length ? me.hand.map(c => renderCard(c)).join('') : '';
    const ps = document.getElementById('playerScore');
    if (me.hand.length) {
      const t = calcHand(me.hand);
      ps.innerHTML = t === 21 && me.hand.length === 2 ? '<span class="hand-score" style="color:var(--gold2)">BLACKJACK!</span>' : `<span class="hand-score">${t}</span>`;
    } else ps.innerHTML = '';
  }
  const dh = document.getElementById('dealerHand');
  if (state.dealer.hand.length) {
    const showAll = state.phase === 'resolve';
    dh.innerHTML = state.dealer.hand.map((c, i) => renderCard(c, !showAll && i === 1)).join('');
    const ds = document.getElementById('dealerScore');
    if (showAll) {
      const t = calcHand(state.dealer.hand);
      ds.innerHTML = t === 21 && state.dealer.hand.length === 2 ? '<span class="hand-score" style="color:var(--gold2)">BLACKJACK!</span>' : `<span class="hand-score">${t}</span>`;
    } else ds.innerHTML = `<span class="hand-score">${state.dealer.visibleTotal}</span>`;
  } else { dh.innerHTML = ''; document.getElementById('dealerScore').innerHTML = ''; }

  document.getElementById('otherPlayers').innerHTML = state.players
    .filter(p => p.id !== myId && p.bet > 0)
    .map(p => `<div class="bj-other-player">
      <div class="bj-other-name">${p.name}</div>
      <div class="card-hand">${p.hand.map(c => renderCard(c, false, true)).join('')}</div>
      ${p.hand.length ? `<span class="hand-score">${calcHand(p.hand)}</span>` : ''}
    </div>`).join('');

  const msgEl = document.getElementById('bjMessage');
  if (state.message) {
    msgEl.textContent = state.message;
    msgEl.className = 'bj-msg-text ' + (state.messageType || '');
    msgEl.style.display = 'block';
  } else msgEl.style.display = 'none';

  updatePlayerTabs(state, me);
  updateControls(state, me);
  updateScore(state);
}

function updatePlayerTabs(state, me) {
  const sorted = state.players.filter(p => p.bet >= 10);
  const current = sorted.find(p => !p.done);
  document.getElementById('playerTabs').innerHTML = state.players.map(p =>
    `<div class="bj-ptab ${p.id === myId ? 'active' : ''} ${current?.id === p.id ? 'active' : ''} ${p.done ? 'done' : ''}">${p.name}${p.id === myId ? ' (You)' : ''}</div>`
  ).join('');
}

function updateControls(state, me) {
  const bet = document.getElementById('bettingPanel');
  const act = document.getElementById('actionPanel');
  const end = document.getElementById('endPanel');
  const dealBtn = document.getElementById('dealBtn');
  const betRow = document.getElementById('betInputRow');
  const chipsRow = document.getElementById('chipsRow');
  const title = document.getElementById('bettingTitle');
  [bet, act, end].forEach(el => el.style.display = 'none');

  if (state.phase === 'betting') {
    bet.style.display = 'block';
    const hasDealt = state.players.some(p => p.hand.length > 0);
    if (!me || me.chips <= 0) { title.textContent = 'No chips remaining'; betRow.style.display = 'none'; chipsRow.style.display = 'none'; dealBtn.style.display = 'none'; return; }
    title.textContent = me.bet > 0 ? `BET PLACED ($${me.bet})` : 'PLACE YOUR BET';
    betRow.style.display = 'flex'; chipsRow.style.display = 'flex';
    dealBtn.style.display = (me.isHost && !hasDealt) ? 'block' : 'none';
  } else if (state.phase === 'playing') {
    const sorted = state.players.filter(p => p.bet >= 10);
    const current = sorted.find(p => !p.done);
    if (current?.id === myId) {
      act.style.display = 'block';
      document.getElementById('dblBtn').disabled = me.hand.length !== 2 || me.chips < me.bet;
    } else {
      bet.style.display = 'block';
      betRow.style.display = 'none'; chipsRow.style.display = 'none'; dealBtn.style.display = 'none';
      title.textContent = current ? `${current.name} is playing...` : 'Waiting...';
    }
  } else if (state.phase === 'dealer') {
    bet.style.display = 'block';
    betRow.style.display = 'none'; chipsRow.style.display = 'none'; dealBtn.style.display = 'none';
    title.textContent = 'Dealer is playing...';
  } else if (state.phase === 'resolve') {
    end.style.display = 'block';
    document.getElementById('nextRoundBtn').disabled = !me?.isHost;
  }
}

function setBet(v) { const m = gameState?.players.find(p => p.id === myId); if (!m) return; document.getElementById('betInput').value = Math.min(v, m.chips); socket.emit('placeBet', { bet: Math.min(v, m.chips) }); }
function halveBet() { const el = document.getElementById('betInput'); el.value = Math.max(10, Math.floor(parseInt(el.value) / 2)); socket.emit('placeBet', { bet: parseInt(el.value) }); }
function doubleBet() { const m = gameState?.players.find(p => p.id === myId); if (!m) return; const el = document.getElementById('betInput'); el.value = Math.min(parseInt(el.value) * 2, m.chips); socket.emit('placeBet', { bet: parseInt(el.value) }); }
function deal() {
  const me = gameState?.players.find(p => p.id === myId);
  if (!me) return;
  if (me.bet < 10) { const b = parseInt(document.getElementById('betInput').value); if (b >= 10 && b <= me.chips) socket.emit('placeBet', { bet: b }); else return; }
  setTimeout(() => socket.emit('deal'), 200);
}
function hit() { socket.emit('hit'); }
function stand() { socket.emit('stand'); }
function doubleDown() { socket.emit('doubleDown'); }
function nextRound() { socket.emit('nextRound'); }

function toggleScore() {
  scoreOpen = !scoreOpen;
  document.getElementById('scoreboard').style.display = scoreOpen ? 'block' : 'none';
}

function updateScore(state) {
  document.getElementById('scoreBody').innerHTML = state.players.map(p =>
    `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:10px;font-weight:${p.id===myId?'700':'500'}">${p.name}${p.id===myId?' (You)':''}</td>
      <td style="padding:10px;text-align:center;color:var(--gold2);font-weight:700">$${p.chips}</td>
      <td style="padding:10px;text-align:center;color:var(--green)">${p.wins}</td>
      <td style="padding:10px;text-align:center;color:var(--red)">${p.losses}</td>
      <td style="padding:10px;text-align:center;color:var(--text3)">${p.pushes}</td>
    </tr>`
  ).join('');
}

function calcHand(hand) {
  let t = 0, a = 0;
  for (const c of hand) { t += cval(c); if (c.rank === 'A') a++; }
  while (t > 21 && a > 0) { t -= 10; a--; }
  return t;
}

function cval(c) {
  if (['J','Q','K'].includes(c.rank)) return 10;
  if (c.rank === 'A') return 11;
  return parseInt(c.rank);
}

function renderCard(card, hidden = false, small = false) {
  if (hidden) return `<div class="playing-card${small?' small':''}"><div class="pcard-face hidden-card"></div></div>`;
  const red = card.suit === 'â™¥' || card.suit === 'â™¦';
  return `<div class="playing-card ${red ? 'red' : 'black'}${small?' small':''}">
    <div class="pcard-face">
      <div class="pcard-tl">${card.rank}<br>${card.suit}</div>
      <div class="pcard-center">${card.suit}</div>
      <div class="pcard-br">${card.rank}<br>${card.suit}</div>
    </div>
  </div>`;
}
</script>
</body>
</html>
