<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Crash — Obsidian Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .space-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#0a0520 0%,#040210 60%,#020108 100%);z-index:-1}
    #starCanvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
    .crash-wrap{max-width:900px;margin:0 auto;padding:24px 16px}
    /* Header */
    .crash-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .crash-title-row{display:flex;align-items:center;gap:10px}
    .crash-icon{width:44px;height:44px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center}
    .crash-title-row h1{font-size:1.3rem;font-weight:900;letter-spacing:3px}
    .he-pill{background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);color:#00ff88;font-size:0.7rem;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:1px}
    /* History */
    .crash-history{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;min-height:28px}
    .h-chip{padding:4px 10px;border-radius:20px;font-size:0.72rem;font-weight:800;letter-spacing:0.5px;cursor:default}
    .h-low{background:rgba(241,50,63,0.15);color:#f1323f;border:1px solid rgba(241,50,63,0.25)}
    .h-mid{background:rgba(240,192,64,0.12);color:#f0c040;border:1px solid rgba(240,192,64,0.2)}
    .h-high{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.2)}
    .h-mega{background:rgba(139,92,246,0.15);color:#a78bfa;border:1px solid rgba(139,92,246,0.25)}
    /* Main canvas area */
    .crash-canvas-wrap{position:relative;background:linear-gradient(180deg,#06030f 0%,#040210 100%);border:1px solid rgba(0,255,136,0.1);border-radius:20px;overflow:hidden;margin-bottom:14px}
    #crashCanvas{display:block;width:100%}
    /* Overlay: multiplier + status */
    .crash-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:8px}
    .crash-mult{font-size:4rem;font-weight:900;letter-spacing:-2px;line-height:1;transition:color 0.2s,text-shadow 0.3s;color:#00ff88;text-shadow:0 0 40px rgba(0,255,136,0.5);font-variant-numeric:tabular-nums}
    .crash-mult.crashed{color:#f1323f;text-shadow:0 0 60px rgba(241,50,63,0.7),0 0 100px rgba(241,50,63,0.3)}
    .crash-status{font-size:0.75rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#4a6375}
    .crash-status.betting{color:#f0c040}
    .crash-status.running{color:#00ff88}
    .crash-status.crashed{color:#f1323f}
    /* Bottom controls layout */
    .crash-controls{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
    .crash-bet-panel{flex:1;min-width:280px;background:#0a0f1e;border:1px solid rgba(0,255,136,0.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
    .crash-action-col{display:flex;flex-direction:column;gap:10px;min-width:160px}
    /* Labels */
    .field-label{font-size:0.62rem;font-weight:800;color:#2a3f52;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px}
    /* Inputs */
    .field-row{display:flex;gap:6px;align-items:center}
    .crash-input{flex:1;background:#040a18;border:1px solid rgba(0,255,136,0.12);border-radius:8px;color:#fff;font-size:1rem;font-weight:700;padding:10px 12px;outline:none;font-family:inherit;min-width:0}
    .crash-input:focus{border-color:#00ff88}
    .fadj{background:#0d1a30;border:1px solid rgba(255,255,255,0.07);color:#8ea3b1;border-radius:6px;padding:8px 10px;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .fadj:hover{background:#152540;color:#fff}
    .presets{display:flex;gap:5px;flex-wrap:wrap}
    .presets button{background:#040a18;border:1px solid rgba(0,255,136,0.08);color:#4a6375;border-radius:6px;padding:5px 8px;font-size:0.7rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .presets button:hover{background:#0a1a30;color:#00ff88;border-color:rgba(0,255,136,0.25)}
    /* Auto cashout */
    .autocash-row{display:flex;align-items:center;gap:10px}
    .toggle-label{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:#4a6375;cursor:pointer;user-select:none}
    .toggle-label input{accent-color:#00ff88;width:14px;height:14px}
    /* Balance */
    .balance-chip{background:#040a18;border:1px solid rgba(0,255,136,0.1);border-radius:10px;padding:10px 14px;font-size:0.8rem;color:#4a6375;text-align:center}
    .balance-chip strong{color:#fff;font-size:1rem}
    /* Buttons */
    .btn-bet{background:#00ff88;color:#000;border:none;border-radius:12px;padding:14px;font-size:0.95rem;font-weight:900;cursor:pointer;letter-spacing:1px;transition:all 0.15s;width:100%;text-transform:uppercase}
    .btn-bet:hover:not(:disabled){background:#40ffaa;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,255,136,0.35)}
    .btn-bet:disabled{background:#0d1a30;color:#2a3f52;cursor:not-allowed}
    .btn-cashout{background:linear-gradient(135deg,#f0c040,#f59e0b);color:#000;border:none;border-radius:12px;padding:14px;font-size:0.95rem;font-weight:900;cursor:pointer;letter-spacing:1px;transition:all 0.15s;width:100%;display:none;text-transform:uppercase;animation:cashPulse 1.5s ease-in-out infinite}
    @keyframes cashPulse{0%,100%{box-shadow:0 0 8px rgba(240,192,64,0.3)}50%{box-shadow:0 0 24px rgba(240,192,64,0.7)}}
    .btn-cashout:hover{filter:brightness(1.1);transform:translateY(-1px)}
    /* Session list */
    .session-card{background:#0a0f1e;border:1px solid rgba(0,255,136,0.08);border-radius:14px;overflow:hidden;margin-top:14px}
    .session-head{padding:10px 16px;font-size:0.62rem;font-weight:800;color:#2a3f52;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid rgba(0,255,136,0.06)}
    .session-list{padding:8px 16px;display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto}
    .session-row{display:flex;justify-content:space-between;font-size:0.78rem;padding:3px 0}
    @media(max-width:600px){.crash-controls{flex-direction:column}}
  </style>
</head>
<body>
<div class="space-bg"></div>
<canvas id="starCanvas"></canvas>
<script src="/casino-core.js"></script>
<script>Casino.renderSidebar('crash');Casino.requireAuth();</script>

<main class="casino-main">
<div class="crash-wrap">

  <div class="crash-hdr">
    <div class="crash-title-row">
      <div class="crash-icon">
        <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
          <path d="M12 2C9 2 6.5 4 6 7L4 18l4-3h8l4 3-2-11C17.5 4 15 2 12 2z" fill="rgba(0,255,136,0.2)" stroke="#00ff88" stroke-width="1.2"/>
          <path d="M9 18l-2 4h10l-2-4" fill="rgba(255,100,100,0.3)" stroke="rgba(255,100,100,0.6)" stroke-width="1"/>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── Star field ──
const starCanvas = document.getElementById('starCanvas');
const stCtx = starCanvas.getContext('2d');
const stars = [];
function resizeStars() { starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight; }
resizeStars();
window.addEventListener('resize', resizeStars);
for (let i = 0; i < 200; i++) {
  stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + 0.3, o: Math.random() * 0.6 + 0.2, blink: Math.random() * 3 });
}
function animateStars() {
  stCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  const t = Date.now() / 1000;
  stars.forEach(s => {
    const o = s.o * (0.7 + 0.3 * Math.sin(t * s.blink));
    stCtx.beginPath();
    stCtx.arc(s.x * starCanvas.width, s.y * starCanvas.height, s.r, 0, Math.PI * 2);
    stCtx.fillStyle = `rgba(200,220,255,${o})`;
    stCtx.fill();
  });
  requestAnimationFrame(animateStars);
}
animateStars();

// ── Game Canvas ──
const canvas = document.getElementById('crashCanvas');
const ctx = canvas.getContext('2d');
let phase = 'waiting', currentMult = 1.0;
let myBet = 0, myCashedOut = false, balance = 0;
let graphPoints = [], animFrame = null, sessionBets = [];
let bettingCountdown = 0, bettingStart = 0;

function resizeCanvas() {
  const w = canvas.parentElement.clientWidth;
  canvas.width = w;
  canvas.height = Math.min(360, Math.round(w * 0.42));
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); drawGraph(); });

// Rocket SVG path builder
function drawRocket(x, y, angle, crashed) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle - Math.PI / 2);
  if (!crashed) {
    // Flame trail
    const grad = ctx.createLinearGradient(0, 10, 0, 40);
    grad.addColorStop(0, 'rgba(0,255,136,0.8)');
    grad.addColorStop(0.5, 'rgba(255,150,0,0.4)');
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.moveTo(-5, 12);
    ctx.lineTo(0, 38 + Math.random() * 6);
    ctx.lineTo(5, 12);
    ctx.fillStyle = grad;
    ctx.fill();
  }
  // Body
  ctx.fillStyle = crashed ? '#f1323f' : '#e8f0ff';
  ctx.beginPath();
  ctx.moveTo(0, -18); // tip
  ctx.bezierCurveTo(6, -10, 7, 0, 6, 12);
  ctx.lineTo(-6, 12);
  ctx.bezierCurveTo(-7, 0, -6, -10, 0, -18);
  ctx.fill();
  // Window
  ctx.beginPath();
  ctx.arc(0, -4, 4, 0, Math.PI * 2);
  ctx.fillStyle = crashed ? 'rgba(241,50,63,0.6)' : 'rgba(0,180,255,0.7)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
  // Fins
  ctx.fillStyle = crashed ? '#b00010' : '#8090b0';
  ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(12, 14); ctx.lineTo(6, 14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-12, 14); ctx.lineTo(-6, 14); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGraph() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const PAD_L = 50, PAD_B = 40, PAD_R = 20, PAD_T = 20;

  // Grid
  ctx.strokeStyle = 'rgba(0,255,136,0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const y = PAD_T + (H - PAD_T - PAD_B) * (1 - i / 4);
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,136,0.3)';
    ctx.font = '10px Inter';
    ctx.fillText((1 + i).toFixed(0) + 'x', 4, y + 4);
  }
  // X axis
  ctx.beginPath();
  ctx.moveTo(PAD_L, H - PAD_B);
  ctx.lineTo(W - PAD_R, H - PAD_B);
  ctx.strokeStyle = 'rgba(0,255,136,0.15)';
  ctx.stroke();

  if (graphPoints.length < 2) return;

  const maxMult = Math.max(...graphPoints, 2.5);
  const scaleX = (W - PAD_L - PAD_R) / Math.max(graphPoints.length - 1, 1);
  const plotH = H - PAD_T - PAD_B;

  function toCanvas(i, m) {
    const x = PAD_L + i * scaleX;
    const y = PAD_T + plotH * (1 - (m - 1) / (maxMult - 1 + 0.01));
    return [x, y];
  }

  const crashed = phase === 'crashed';
  const lineColor = crashed ? '#f1323f' : '#00ff88';

  // Fill
  ctx.beginPath();
  ctx.moveTo(PAD_L, H - PAD_B);
  for (let i = 0; i < graphPoints.length; i++) {
    const [x, y] = toCanvas(i, graphPoints[i]);
    ctx.lineTo(x, y);
  }
  const last = toCanvas(graphPoints.length - 1, graphPoints[graphPoints.length - 1]);
  ctx.lineTo(last[0], H - PAD_B);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, crashed ? 'rgba(241,50,63,0.2)' : 'rgba(0,255,136,0.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Glow line
  ctx.shadowColor = lineColor;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  for (let i = 0; i < graphPoints.length; i++) {
    const [x, y] = toCanvas(i, graphPoints[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Rocket at end of line
  if (graphPoints.length > 2) {
    const [lx, ly] = toCanvas(graphPoints.length - 1, graphPoints[graphPoints.length - 1]);
    const [px, py] = toCanvas(graphPoints.length - 2, graphPoints[graphPoints.length - 2]);
    const angle = Math.atan2(ly - py, lx - px);
    drawRocket(lx, ly, angle + Math.PI / 2, crashed);
  }

  // Explosion on crash
  if (crashed && graphPoints.length > 0) {
    const [ex, ey] = toCanvas(graphPoints.length - 1, graphPoints[graphPoints.length - 1]);
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 * i) / 12;
      const dist = 20 + Math.random() * 15;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex + Math.cos(angle) * dist, ey + Math.sin(angle) * dist);
      ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,80,0,0.6)' : 'rgba(255,220,0,0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
}

function renderHistory(history) {
  const el = document.getElementById('crashHistory');
  el.innerHTML = history.map(m => {
    const cls = m < 1.5 ? 'h-low' : m < 3 ? 'h-mid' : m < 10 ? 'h-high' : 'h-mega';
    return `<span class="h-chip ${cls}">${m.toFixed(2)}×</span>`;
  }).join('');
}

function setUIPhase(p) {
  const betBtn = document.getElementById('betBtn');
  const cashoutBtn = document.getElementById('cashoutBtn');
  const mult = document.getElementById('crashMult');
  const status = document.getElementById('crashStatus');
  mult.classList.remove('crashed');

  if (p === 'betting') {
    betBtn.style.display = 'block'; betBtn.disabled = false; betBtn.textContent = 'PLACE BET';
    cashoutBtn.style.display = 'none';
    status.className = 'crash-status betting';
  } else if (p === 'running') {
    if (myBet > 0 && !myCashedOut) {
      betBtn.style.display = 'none';
      cashoutBtn.style.display = 'block';
    } else {
      betBtn.style.display = 'block'; betBtn.disabled = true; betBtn.textContent = 'IN FLIGHT...';
      cashoutBtn.style.display = 'none';
    }
    status.className = 'crash-status running';
  } else if (p === 'crashed') {
    mult.classList.add('crashed');
    status.className = 'crash-status crashed';
    betBtn.style.display = 'block'; betBtn.disabled = true; betBtn.textContent = 'NEXT ROUND...';
    cashoutBtn.style.display = 'none';
  } else {
    betBtn.style.display = 'block'; betBtn.disabled = true; betBtn.textContent = 'WAITING...';
    cashoutBtn.style.display = 'none';
    status.className = 'crash-status';
  }
}

function startDrawLoop() {
  if (animFrame) cancelAnimationFrame(animFrame);
  function loop() {
    if (phase === 'running') {
      const elapsed = (Date.now() - window._crashStart) / 1000;
      const mult = Math.floor(Math.pow(Math.E, elapsed * 0.07) * 100) / 100;
      currentMult = mult;
      graphPoints.push(mult);
      if (graphPoints.length > 1000) graphPoints = graphPoints.slice(-500);

      const multEl = document.getElementById('crashMult');
      multEl.textContent = mult.toFixed(2) + '×';
      multEl.style.color = mult >= 5 ? '#a78bfa' : mult >= 2 ? '#f0c040' : '#00ff88';
      multEl.style.textShadow = mult >= 5 ? '0 0 40px rgba(167,139,250,0.6)' : mult >= 2 ? '0 0 40px rgba(240,192,64,0.5)' : '0 0 40px rgba(0,255,136,0.5)';

      if (myBet > 0 && !myCashedOut) {
        const cashoutAmtEl = document.getElementById('cashoutAmt');
        cashoutAmtEl.textContent = '$' + (myBet * mult).toFixed(2);
        // Auto cashout
        const autoEn = document.getElementById('autoEn').checked;
        const autoVal = parseFloat(document.getElementById('autoCashout').value);
        if (autoEn && autoVal >= 1.01 && mult >= autoVal) cashout();
      }

      drawGraph();
      animFrame = requestAnimationFrame(loop);
    }
  }
  animFrame = requestAnimationFrame(loop);
}

// Socket
const socket = io();
socket.emit('crash:join');

socket.on('crash:state', state => {
  phase = state.phase;
  renderHistory(state.history);
  if (phase === 'running') {
    graphPoints = [1.0];
    window._crashStart = Date.now() - (Math.log(state.mult) / 0.07) * 1000;
    setUIPhase('running');
    document.getElementById('crashStatus').textContent = 'FLYING';
    startDrawLoop();
  } else if (phase === 'betting') {
    graphPoints = []; drawGraph();
    setUIPhase('betting');
    document.getElementById('crashMult').textContent = '1.00×';
    document.getElementById('crashMult').style.color = '#00ff88';
  } else {
    setUIPhase('waiting');
    document.getElementById('crashMult').textContent = state.mult.toFixed(2) + '×';
    document.getElementById('crashStatus').textContent = 'Waiting...';
  }
});

socket.on('crash:betting', ({ round, duration }) => {
  phase = 'betting'; myBet = 0; myCashedOut = false;
  graphPoints = []; drawGraph();
  document.getElementById('crashMult').textContent = '1.00×';
  document.getElementById('crashMult').style.color = '#00ff88';
  document.getElementById('crashMult').classList.remove('crashed');
  setUIPhase('betting');
  bettingStart = Date.now(); bettingCountdown = duration;
  if (animFrame) cancelAnimationFrame(animFrame);
  function tick() {
    const left = Math.max(0, bettingCountdown - (Date.now() - bettingStart));
    document.getElementById('crashStatus').textContent = `BETTING: ${(left/1000).toFixed(1)}s`;
    document.getElementById('crashStatus').className = 'crash-status betting';
    if (left > 0 && phase === 'betting') animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
});

socket.on('crash:start', () => {
  phase = 'running';
  window._crashStart = Date.now();
  graphPoints = [1.0];
  setUIPhase('running');
  document.getElementById('crashStatus').textContent = 'FLYING';
  startDrawLoop();
});

socket.on('crash:bust', ({ mult }) => {
  phase = 'crashed';
  if (animFrame) cancelAnimationFrame(animFrame);
  graphPoints.push(mult);
  drawGraph();
  document.getElementById('crashMult').textContent = mult.toFixed(2) + '×';
  document.getElementById('crashMult').classList.add('crashed');
  document.getElementById('crashStatus').textContent = 'CRASHED!';
  setUIPhase('crashed');
  if (myBet > 0 && !myCashedOut) { addSession(myBet, 0, mult); myBet = 0; }
  socket.emit('crash:join');
});

socket.on('crash:betPlaced', ({ amount, balance: newBal }) => {
  myBet = amount; balance = newBal;
  document.getElementById('balDisp').textContent = '$' + balance.toFixed(2);
  Casino.syncBalance(balance);
  setUIPhase('running');
});

socket.on('crash:cashedOut', ({ mult, win, balance: newBal }) => {
  myCashedOut = true; balance = newBal;
  document.getElementById('balDisp').textContent = '$' + balance.toFixed(2);
  Casino.syncBalance(balance);
  addSession(myBet, win, mult);
  myBet = 0;
  document.getElementById('cashoutBtn').style.display = 'none';
  document.getElementById('betBtn').style.display = 'block';
  document.getElementById('betBtn').disabled = true;
  document.getElementById('betBtn').textContent = 'CASHED ✓';
  document.getElementById('betBtn').style.background = '#00ff88';
  document.getElementById('betBtn').style.color = '#000';
  setTimeout(() => {
    document.getElementById('betBtn').style.background = '';
    document.getElementById('betBtn').style.color = '';
  }, 2000);
});

function placeBet() {
  if (phase !== 'betting') return;
  const amount = parseFloat(document.getElementById('betInput').value);
  if (!amount || amount <= 0 || amount > balance) return;
  socket.emit('crash:bet', { amount });
}

function cashout() {
  if (phase !== 'running' || myBet <= 0 || myCashedOut) return;
  socket.emit('crash:cashout');
}

function addSession(wagered, returned, mult) {
  const net = returned - wagered;
  const list = document.getElementById('sessionList');
  if (list.querySelector('[style*="No bets"]')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'session-row';
  row.innerHTML = `<span style="color:#4a6375">@${mult.toFixed(2)}×</span><span>$${wagered.toFixed(2)}</span><span style="font-weight:700;color:${net>=0?'#00ff88':'#f1323f'}">${net>=0?'+':''}$${net.toFixed(2)}</span>`;
  list.insertBefore(row, list.firstChild);
}

function adjBet(f) {
  const el = document.getElementById('betInput');
  el.value = Math.max(1, Math.round(parseFloat(el.value || 1) * f));
}
function sb(v) { document.getElementById('betInput').value = Math.min(v, balance); }

// Load
fetch('/api/me').then(r=>r.json()).then(d=>{ balance=d.balance; document.getElementById('balDisp').textContent='$'+balance.toFixed(2); Casino.syncBalance(balance); }).catch(()=>{});
fetch('/api/rates').then(r=>r.json()).then(d=>{ if(d.crash?.house_edge) document.getElementById('heBadge').textContent=(d.crash.house_edge*100).toFixed(0)+'%'; }).catch(()=>{});
</script>
