<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 Blackjack - Casino Table</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="casino-background"></div>
  
  <div class="player-setup-screen" id="setupScreen">
    <div class="setup-card">
      <div class="casino-logo">
        <div class="logo-diamond">21</div>
        <h1>BLACKJACK</h1>
        <p class="tagline">Gather your friends and hit the tables</p>
      </div>
      <div class="setup-form">
        <div class="input-group">
          <input type="text" id="playerNameInput" placeholder="Enter player name" maxlength="15">
          <button id="addPlayerBtn" onclick="addPlayer()">
            <span class="icon">+</span> Add
          </button>
        </div>
        <div class="players-list" id="playersList"></div>
        <button id="startGameBtn" onclick="startGame()" disabled>
          <span class="icon">🎰</span> OPEN TABLE
        </button>
        <p class="player-count" id="playerCount">Add 1-6 players to begin</p>
      </div>
    </div>
  </div>

  <div class="game-screen" id="gameScreen" style="display: none;">
    <header class="table-header">
      <div class="header-left">
        <div class="logo-small">21</div>
      </div>
      <div class="round-badge">Round <span id="roundNumber">1</span></div>
    </header>

    <div class="blackjack-table">
      <div class="table-felt">
        <div class="felt-border"></div>
        <div class="felt-inner-ring"></div>
        
        <div class="dealer-area">
          <div class="position-label">DEALER</div>
          <div class="dealer-hand-container">
            <div class="hand" id="dealerHand"></div>
            <div class="hand-value" id="dealerValue"></div>
          </div>
        </div>

        <div class="table-center">
          <div class="pot-display" id="potDisplay">
            <div class="pot-label">POT</div>
            <div class="pot-amount" id="potAmount">$0</div>
          </div>
        </div>

        <div class="message-area" id="messageArea">
          <div class="message-content" id="messageContent"></div>
        </div>

        <div class="player-area">
          <div class="current-player-indicator">
            <div class="player-badge" id="playerBadge">
              <span id="activePlayerName">Player</span>
              <span class="player-chips" id="playerChips">$1000</span>
            </div>
          </div>
          <div class="player-hand-container">
            <div class="hand" id="playerHand"></div>
            <div class="hand-value" id="playerValue"></div>
            <div class="bet-amount" id="betAmount">Bet: $0</div>
          </div>
        </div>

        <div class="dealer-chip-stack"></div>
        <div class="card-shoe"></div>
      </div>
    </div>

    <div class="controls-area">
      <div class="betting-panel" id="bettingPanel">
        <div class="panel-title">Place Your Bet</div>
        <div class="bet-row">
          <button class="chip-btn chip-5" onclick="adjustBet(-50)">−50</button>
          <div class="bet-display-box">
            <span class="dollar">$</span>
            <input type="number" id="betInput" value="100" min="10" step="10">
          </div>
          <button class="chip-btn chip-5" onclick="adjustBet(50)">+50</button>
        </div>
        <div class="chips-tray">
          <button class="chip chip-10" onclick="setBet(10)">10</button>
          <button class="chip chip-25" onclick="setBet(25)">25</button>
          <button class="chip chip-50" onclick="setBet(50)">50</button>
          <button class="chip chip-100" onclick="setBet(100)">100</button>
          <button class="chip chip-250" onclick="setBet(250)">250</button>
          <button class="chip chip-500" onclick="setBet(500)">500</button>
        </div>
        <button id="dealBtn" class="action-main deal" onclick="deal()">
          DEAL CARDS
        </button>
      </div>

      <div class="action-panel" id="actionPanel" style="display: none;">
        <button class="action-btn hit" onclick="hit()">
          <span class="btn-icon">👊</span> HIT
        </button>
        <button class="action-btn stand" onclick="stand()">
          <span class="btn-icon">🛑</span> STAND
        </button>
        <button class="action-btn double" id="doubleBtn" onclick="doubleDown()">
          <span class="btn-icon">×2</span> DOUBLE
        </button>
      </div>

      <div class="end-panel" id="endPanel" style="display: none;">
        <button id="nextRoundBtn" class="action-main next" onclick="nextRound()">
          NEXT ROUND
        </button>
      </div>
    </div>

    <div class="player-tabs-container" id="playerTabsContainer">
      <div class="player-tabs" id="playerTabs"></div>
    </div>

    <div class="scoreboard-container" id="scoreboardContainer">
      <div class="scoreboard-toggle" onclick="toggleScoreboard()">
        <span>📊</span> Scoreboard
      </div>
      <div class="scoreboard" id="scoreboard">
        <table>
          <thead>
            <tr>
              <th>Player</th>
              <th>Chips</th>
              <th>W</th>
              <th>L</th>
              <th>P</th>
            </tr>
          </thead>
          <tbody id="scoreboardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
