<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Obsidian Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:'Inter',sans-serif;background:#080e14;color:#fff;overflow:hidden}
    .bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,199,77,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(20,117,225,0.06) 0%,transparent 60%);pointer-events:none}
    .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .p{position:absolute;width:2px;height:2px;background:rgba(0,199,77,0.4);border-radius:50%;animation:float linear infinite}
    @keyframes float{from{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}to{transform:translateY(-10vh) translateX(var(--dx));opacity:0}}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
    .card{background:#0f1923;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 40px 80px rgba(0,0,0,0.6)}
    .logo{text-align:center;margin-bottom:32px}
    .logo-mark{width:56px;height:56px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
    .logo-mark svg{width:56px;height:56px}
    .logo h1{font-size:1.6rem;font-weight:900;letter-spacing:3px;margin-bottom:4px}
    .logo p{font-size:0.82rem;color:#4a6375;font-weight:500}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#4a6375;font-size:0.75rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}
    .btn{width:100%;padding:13px;border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;letter-spacing:0.3px}
    .btn-google{background:#fff;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
    .btn-google:hover{background:#f5f5f5;transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,255,255,0.15)}
    .btn-google svg{width:20px;height:20px;flex-shrink:0}
    .btn-green{background:#00c74d;color:#000;margin-top:6px}
    .btn-green:hover{background:#00e858;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,199,77,0.4)}
    .btn-ghost{background:transparent;color:#8ea3b1;border:1px solid rgba(255,255,255,0.08);margin-top:8px}
    .btn-ghost:hover{background:rgba(255,255,255,0.04);color:#fff}
    .input-wrap{margin-bottom:10px}
    .input-wrap input{width:100%;background:#162232;border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:0.9rem;padding:12px 14px;outline:none;transition:border-color 0.2s;font-family:inherit}
    .input-wrap input:focus{border-color:#00c74d}
    .input-wrap input::placeholder{color:#4a6375}
    .section-title{font-size:0.7rem;font-weight:700;color:#4a6375;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
    .error-box{background:rgba(241,50,63,0.1);border:1px solid rgba(241,50,63,0.3);border-radius:8px;padding:10px 14px;color:#f1323f;font-size:0.82rem;text-align:center;margin-bottom:12px}
    .chips-note{display:flex;align-items:center;gap:8px;background:rgba(0,199,77,0.06);border:1px solid rgba(0,199,77,0.15);border-radius:8px;padding:10px 14px;font-size:0.78rem;color:#8ea3b1;margin-top:16px}
    .chips-note strong{color:#00c74d}
    .tab-row{display:flex;background:#0a1520;border-radius:8px;padding:3px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.05)}
    .tab{flex:1;padding:8px;background:transparent;border:none;color:#4a6375;font-weight:700;font-size:0.8rem;border-radius:6px;cursor:pointer;transition:all 0.2s;font-family:inherit}
    .tab.active{background:#162232;color:#fff}
    #googleDisabled{background:rgba(255,255,255,0.04);color:#4a6375;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;cursor:not-allowed}
    #googleDisabled svg{width:20px;height:20px;opacity:0.4}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="particles" id="particles"></div>

<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 56 56" fill="none">
          <polygon points="28,4 52,16 52,40 28,52 4,40 4,16" fill="rgba(0,199,77,0.1)" stroke="#00c74d" stroke-width="1.5"/>
          <path d="M18 28l8 8 14-14" stroke="#00c74d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>OBSIDIAN</h1>
      <p>Premium Casino Experience</p>
    </div>

    <div id="errorBox" class="error-box" style="display:none">Invalid credentials. Try again.</div>

    <div class="tab-row">
      <button class="tab active" onclick="switchTab('play',this)">Play Now</button>
      <button class="tab" onclick="switchTab('admin',this)">Admin Login</button>
    </div>

    <!-- PLAY TAB -->
    <div id="playTab">
      <div id="googleBtn">
        <!-- Google button shown if configured, otherwise disabled -->
      </div>
      <div class="divider">or play as guest</div>
      <div class="section-title">GUEST ACCESS</div>
      <form method="POST" action="/auth/guest">
        <div class="input-wrap">
          <input type="text" name="name" placeholder="Enter your display name" maxlength="20" required>
        </div>
        <button type="submit" class="btn btn-green">PLAY AS GUEST →</button>
      </form>
      <div class="chips-note">
        <svg viewBox="0 0 20 20" fill="currentColor" style="width:16px;height:16px;flex-shrink:0;color:#00c74d"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12zm-1-5h2v2H9v-2zm0-6h2v4H9V5z"/></svg>
        Guests start with <strong>$1,000</strong> free chips. Google accounts get <strong>$5,000</strong>.
      </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="adminTab" style="display:none">
      <div class="section-title">OWNER ACCESS</div>
      <form method="POST" action="/auth/admin">
        <div class="input-wrap">
          <input type="text" name="username" placeholder="Username" value="owner" autocomplete="username">
        </div>
        <div class="input-wrap">
          <input type="password" name="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-green">ACCESS ADMIN PANEL</button>
      </form>
      <div class="chips-note" style="margin-top:12px">
        <svg viewBox="0 0 20 20" fill="currentColor" style="width:16px;height:16px;flex-shrink:0;color:#f59e0b"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 11H9V9h2v4zm0-6H9V5h2v2z"/></svg>
        Default credentials: <strong style="color:#f59e0b">owner / owner</strong>
      </div>
    </div>
  </div>
</div>

<script>
// Check for error
if (location.search.includes('error=1')) {
  document.getElementById('errorBox').style.display = 'block';
}

// Check if Google OAuth is configured
fetch('/api/rates').then(() => {
  // Check if google is available by attempting the route
  const googleBtnContainer = document.getElementById('googleBtn');
  // We detect Google by checking if the env is configured
  // We'll just try to fetch a test endpoint
  fetch('/auth/google', { redirect: 'manual' }).then(r => {
    if (r.type === 'opaqueredirect' || r.status === 302 || r.ok) {
      googleBtnContainer.innerHTML = `
        <a href="/auth/google" class="btn btn-google" style="text-decoration:none;display:flex">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </a>`;
    } else {
      googleBtnContainer.innerHTML = `
        <div class="btn" id="googleDisabled">
          <svg viewBox="0 0 24 24"><path fill="#aaa" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#aaa" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#aaa" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#aaa" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google Login (not configured)
        </div>`;
    }
  }).catch(() => {
    googleBtnContainer.innerHTML = '';
  });
});

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('playTab').style.display = tab === 'play' ? 'block' : 'none';
  document.getElementById('adminTab').style.display = tab === 'admin' ? 'block' : 'none';
}

// Particles
const pc = document.getElementById('particles');
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'p';
  const left = Math.random() * 100;
  const delay = Math.random() * 8;
  const dur = 6 + Math.random() * 8;
  const dx = (Math.random() - 0.5) * 100;
  p.style.cssText = `left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s;--dx:${dx}px`;
  pc.appendChild(p);
}
</script>
</body>
</html>
