<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Obsidian Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:'Inter',sans-serif;background:#05080c;color:#dde8f0;overflow:hidden}

    /* ── Background Canvas ── */
    #loginCanvas{position:fixed;inset:0;pointer-events:none;z-index:0}

    /* ── Orbs ── */
    .orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;will-change:transform}
    .orb-1{width:900px;height:900px;background:radial-gradient(circle,rgba(0,90,255,0.18) 0%,transparent 60%);top:-420px;left:-280px;animation:orb1 32s ease-in-out infinite alternate}
    .orb-2{width:700px;height:700px;background:radial-gradient(circle,rgba(150,0,255,0.15) 0%,transparent 60%);bottom:-280px;right:-200px;animation:orb2 42s ease-in-out infinite alternate}
    .orb-3{width:500px;height:500px;background:radial-gradient(circle,rgba(0,200,80,0.1) 0%,transparent 60%);top:40%;left:42%;animation:orb3 28s ease-in-out infinite alternate}
    @keyframes orb1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(120px,90px) scale(1.22)}}
    @keyframes orb2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-90px,-110px) scale(0.82)}}
    @keyframes orb3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(70px,-60px) scale(1.18)}}

    /* ── Layout ── */
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}

    /* ── Card ── */
    .card{
      width:100%;max-width:440px;
      background:linear-gradient(160deg,rgba(13,24,40,0.96) 0%,rgba(8,12,20,0.98) 100%);
      border:1px solid rgba(255,255,255,0.09);
      border-radius:28px;
      padding:44px 40px;
      box-shadow:0 40px 100px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.04),inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter:blur(20px);
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;
      background:linear-gradient(90deg,transparent,rgba(0,230,118,0.7),transparent);
      border-radius:1px;
    }

    /* ── Logo ── */
    .logo{text-align:center;margin-bottom:36px}
    .logo-mark{width:64px;height:64px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;animation:logoPulse 4s ease-in-out infinite}
    @keyframes logoPulse{
      0%,100%{filter:drop-shadow(0 0 8px rgba(0,200,80,0.5))}
      50%{filter:drop-shadow(0 0 28px rgba(0,200,80,0.95))}
    }
    .logo-mark svg{width:64px;height:64px}
    .logo-title{
      font-size:1.5rem;font-weight:900;letter-spacing:5px;
      background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.65) 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin-bottom:6px;
    }
    .logo-sub{font-size:0.72rem;color:#344e60;font-weight:600;letter-spacing:2.5px;text-transform:uppercase}

    /* ── Tabs ── */
    .tab-row{display:flex;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:4px;margin-bottom:26px;gap:4px}
    .tab{
      flex:1;padding:10px;background:transparent;border:none;
      color:#3d5a70;font-weight:700;font-size:0.82rem;letter-spacing:0.5px;
      border-radius:10px;cursor:pointer;transition:all 0.22s;font-family:inherit;
    }
    .tab.active{
      background:linear-gradient(135deg,rgba(0,230,118,0.14),rgba(0,200,100,0.07));
      color:#00e676;border:1px solid rgba(0,230,118,0.22);
      box-shadow:0 2px 14px rgba(0,230,118,0.12);
    }

    /* ── Section label ── */
    .section-label{
      font-size:0.6rem;font-weight:700;color:#253a4c;
      letter-spacing:2.8px;text-transform:uppercase;margin-bottom:14px;
      display:flex;align-items:center;gap:10px;
    }
    .section-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.05)}

    /* ── Divider ── */
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#253a4c;font-size:0.72rem;font-weight:600;letter-spacing:1px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.05)}

    /* ── Inputs ── */
    .input-wrap{margin-bottom:10px}
    .input-wrap input{
      width:100%;
      background:rgba(0,0,0,0.5);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px;color:#dde8f0;font-size:0.92rem;
      padding:14px 16px;outline:none;
      transition:border-color 0.2s,box-shadow 0.2s;font-family:inherit;
    }
    .input-wrap input:focus{
      border-color:rgba(0,230,118,0.45);
      box-shadow:0 0 0 3px rgba(0,230,118,0.1),0 0 20px rgba(0,230,118,0.08);
    }
    .input-wrap input::placeholder{color:#253a4c}

    /* ── Buttons ── */
    .btn{width:100%;padding:15px;border-radius:12px;font-size:0.93rem;font-weight:800;cursor:pointer;transition:all 0.2s;border:none;letter-spacing:0.4px;font-family:inherit;position:relative;overflow:hidden;isolation:isolate}

    /* Google button */
    .btn-google{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1)!important;
      color:#dde8f0;display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:6px;
    }
    .btn-google:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)!important;transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.4)}
    .btn-google svg{width:20px;height:20px;flex-shrink:0}

    /* Primary green button */
    .btn-green{
      background:linear-gradient(135deg,#00e676 0%,#00c853 55%,#00b040 100%);
      color:#000;margin-top:6px;
      box-shadow:0 4px 24px rgba(0,230,118,0.35),inset 0 1px 0 rgba(255,255,255,0.22);
      animation:btnGlow 3s ease-in-out infinite;
    }
    .btn-green::after{
      content:'';position:absolute;top:-50%;left:-110%;
      width:48%;height:200%;
      background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,0.28) 50%,transparent 75%);
      animation:shimmer 2.8s ease-in-out infinite;pointer-events:none;
    }
    @keyframes shimmer{0%{left:-110%}60%,100%{left:160%}}
    @keyframes btnGlow{
      0%,100%{box-shadow:0 4px 24px rgba(0,230,118,0.35),inset 0 1px 0 rgba(255,255,255,0.22)}
      50%{box-shadow:0 4px 42px rgba(0,230,118,0.6),0 0 0 1px rgba(0,230,118,0.22),inset 0 1px 0 rgba(255,255,255,0.22)}
    }
    .btn-green:hover{
      background:linear-gradient(135deg,#1aff90 0%,#00e676 55%,#00c853 100%);
      transform:translateY(-3px);
      box-shadow:0 10px 48px rgba(0,230,118,0.65),inset 0 1px 0 rgba(255,255,255,0.28);
      animation:none;
    }

    /* Disabled Google */
    #googleDisabled{
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06)!important;
      color:#253a4c;display:flex;align-items:center;justify-content:center;gap:11px;
      margin-bottom:6px;cursor:not-allowed;
    }
    #googleDisabled svg{width:20px;height:20px;opacity:0.35}

    /* ── Error box ── */
    .error-box{
      background:rgba(255,23,68,0.1);border:1px solid rgba(255,23,68,0.28);
      border-radius:10px;padding:11px 16px;color:#ff6b84;font-size:0.82rem;
      text-align:center;margin-bottom:14px;
      animation:shakeIn 0.4s ease;
    }
    @keyframes shakeIn{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

    /* ── Chips note ── */
    .chips-note{
      display:flex;align-items:flex-start;gap:10px;
      background:rgba(0,230,118,0.05);
      border:1px solid rgba(0,230,118,0.12);
      border-radius:10px;padding:12px 16px;font-size:0.78rem;color:#4a6375;margin-top:18px;
      line-height:1.55;
    }
    .chips-note svg{flex-shrink:0;margin-top:1px}
    .chips-note strong{color:#00c853}

    /* Admin chips note variant */
    .chips-note-amber{
      display:flex;align-items:flex-start;gap:10px;
      background:rgba(255,145,0,0.05);
      border:1px solid rgba(255,145,0,0.14);
      border-radius:10px;padding:12px 16px;font-size:0.78rem;color:#4a6375;margin-top:18px;
      line-height:1.55;
    }
    .chips-note-amber svg{flex-shrink:0;margin-top:1px}
    .chips-note-amber strong{color:#ff9100}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
  </style>
</head>
<body>

<canvas id="loginCanvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="wrap">
  <div class="card">

    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 64 64" fill="none">
          <polygon points="32,4 60,18 60,46 32,60 4,46 4,18"
            fill="rgba(0,230,118,0.08)" stroke="rgba(0,230,118,0.55)" stroke-width="1.5"/>
          <polygon points="32,12 52,22 52,42 32,52 12,42 12,22"
            fill="rgba(0,230,118,0.05)" stroke="rgba(0,230,118,0.25)" stroke-width="1"/>
          <path d="M22 32l8 9 16-16" stroke="#00e676" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-title">OBSIDIAN</div>
      <div class="logo-sub">Premium Casino Experience</div>
    </div>

    <div id="errorBox" class="error-box" style="display:none">Invalid credentials. Try again.</div>

    <div class="tab-row">
      <button class="tab active" onclick="switchTab('play',this)">Play Now</button>
      <button class="tab" onclick="switchTab('admin',this)">Admin</button>
    </div>

    <!-- PLAY TAB -->
    <div id="playTab">
      <div id="googleBtn"></div>
      <div class="divider">or play as guest</div>
      <div class="section-label">Guest Access</div>
      <form method="POST" action="/auth/guest">
        <div class="input-wrap">
          <input type="text" name="name" placeholder="Enter your display name" maxlength="20" required autocomplete="off">
        </div>
        <button type="submit" class="btn btn-green">PLAY AS GUEST →</button>
      </form>
      <div class="chips-note">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" color="#00c853">
          <path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12zm-1-5h2v2H9v-2zm0-6h2v4H9V5z"/>
        </svg>
        Guests start with <strong>$1,000</strong> free chips. Google accounts get <strong>$5,000</strong>.
      </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="adminTab" style="display:none">
      <div class="section-label">Owner Access</div>
      <form method="POST" action="/auth/admin">
        <div class="input-wrap">
          <input type="text" name="username" placeholder="Username" value="owner" autocomplete="username">
        </div>
        <div class="input-wrap">
          <input type="password" name="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-green">ACCESS ADMIN PANEL</button>
      </form>
      <div class="chips-note-amber">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" color="#ff9100">
          <path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 11H9V9h2v4zm0-6H9V5h2v2z"/>
        </svg>
        Default credentials: <strong>owner / owner</strong>
      </div>
    </div>

  </div>
</div>

<script>
if (location.search.includes('error=1')) {
  document.getElementById('errorBox').style.display = 'block';
}

fetch('/api/rates').then(() => {
  const googleBtnContainer = document.getElementById('googleBtn');
  fetch('/auth/google', { redirect: 'manual' }).then(r => {
    if (r.type === 'opaqueredirect' || r.status === 302 || r.ok) {
      googleBtnContainer.innerHTML = `
        <a href="/auth/google" class="btn btn-google" style="text-decoration:none;display:flex">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </a>`;
    } else {
      googleBtnContainer.innerHTML = `
        <div class="btn" id="googleDisabled">
          <svg viewBox="0 0 24 24">
            <path fill="#aaa" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#aaa" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#aaa" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#aaa" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google Login (not configured)
        </div>`;
    }
  }).catch(() => { googleBtnContainer.innerHTML = ''; });
});

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('playTab').style.display = tab === 'play' ? 'block' : 'none';
  document.getElementById('adminTab').style.display = tab === 'admin' ? 'block' : 'none';
}

// Canvas particle system
(function() {
  const canvas = document.getElementById('loginCanvas');
  const ctx = canvas.getContext('2d');
  const COLS = ['0,140,255','150,0,255','0,230,88','0,200,240','255,180,0'];
  let W, H, pts = [];
  const N = 55;

  function mkPt() {
    return {
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.32, vy: (Math.random()-0.5)*0.32,
      r: Math.random()*1.6+0.5, op: Math.random()*0.5+0.22,
      c: COLS[Math.floor(Math.random()*COLS.length)]
    };
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    pts = Array.from({length:N}, mkPt);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    for (let i=0;i<pts.length;i++) {
      const p=pts[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.c},${p.op})`;
      ctx.fill();
      for(let j=i+1;j<pts.length;j++){
        const q=pts[j];
        const dx=p.x-q.x, dy=p.y-q.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          ctx.beginPath();
          ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
          ctx.strokeStyle=`rgba(${p.c},${(1-d/120)*0.1})`;
          ctx.lineWidth=0.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
</body>
</html>
