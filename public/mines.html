<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Dungeon Mines — Obsidian Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .dungeon-bg{position:fixed;inset:0;background:#060810;z-index:-1;overflow:hidden}
    .dungeon-bg::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,0.012) 40px,rgba(255,255,255,0.012) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,0.012) 40px,rgba(255,255,255,0.012) 41px)}
    .dungeon-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,80,200,0.04) 0%,transparent 70%)}
    .dungeon-wrap{max-width:740px;margin:0 auto;padding:24px 16px}
    /* Header bar */
    .game-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .game-top-title{display:flex;align-items:center;gap:12px}
    .game-top-title h1{font-size:1.2rem;font-weight:900;letter-spacing:3px;color:#fff}
    .game-top-title .icon-wrap{width:40px;height:40px;border-radius:10px;background:rgba(241,50,63,0.12);border:1px solid rgba(241,50,63,0.25);display:flex;align-items:center;justify-content:center}
    .he-tag{background:rgba(241,50,63,0.1);border:1px solid rgba(241,50,63,0.2);color:#f1323f;font-size:0.7rem;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:1px}
    /* Multiplier bar */
    .mult-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
    .mult-cell{background:#0d1322;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;text-align:center;transition:all 0.3s}
    .mult-cell .mc-label{font-size:0.6rem;font-weight:800;color:#2a3f52;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
    .mult-cell .mc-val{font-size:1.4rem;font-weight:900;color:#fff;letter-spacing:-0.5px}
    .mult-cell.active-mult{border-color:rgba(0,255,136,0.3);background:rgba(0,255,136,0.05)}
    .mult-cell.active-mult .mc-val{color:#00ff88;text-shadow:0 0 20px rgba(0,255,136,0.5)}
    /* GRID */
    .dungeon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
    .d-tile{aspect-ratio:1;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;transition:transform 0.1s,box-shadow 0.2s;border:1px solid rgba(255,255,255,0.06);background:linear-gradient(145deg,#111a2e,#0d1322)}
    .d-tile::before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,0.04) 0%,transparent 60%);pointer-events:none}
    .d-tile:hover:not(.disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,100,255,0.2);border-color:rgba(0,150,255,0.25)}
    .d-tile:active:not(.disabled){transform:scale(0.95)}
    .d-tile.disabled{cursor:default;opacity:0.7}
    .d-tile .rune{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.07;font-size:1.2rem;color:#fff;font-weight:900;pointer-events:none;user-select:none}
    /* Gem tile */
    .d-tile.gem{background:linear-gradient(145deg,rgba(0,200,136,0.15),rgba(0,100,200,0.1));border-color:rgba(0,255,136,0.35);animation:gemReveal 0.35s cubic-bezier(0.34,1.56,0.64,1)}
    .d-tile.gem::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(0,255,136,0.25) 0%,transparent 70%);pointer-events:none}
    @keyframes gemReveal{0%{transform:scale(0.5) rotateY(90deg);opacity:0}60%{transform:scale(1.1) rotateY(-5deg)}100%{transform:scale(1) rotateY(0deg);opacity:1}}
    /* Mine tile */
    .d-tile.mine{background:linear-gradient(145deg,rgba(241,50,63,0.2),rgba(150,0,0,0.15));border-color:rgba(241,50,63,0.5);animation:mineReveal 0.2s ease}
    .d-tile.mine::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(241,50,63,0.35) 0%,transparent 70%);pointer-events:none;animation:minePulse 0.6s ease forwards}
    @keyframes mineReveal{0%{transform:scale(1.2);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes minePulse{0%{opacity:1}100%{opacity:0}}
    .tile-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .tile-inner svg{width:55%;height:55%}
    /* Particles */
    .particle{position:fixed;pointer-events:none;border-radius:50%;animation:particleFly 0.8s ease-out forwards}
    @keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
    /* Controls */
    .controls-wrap{background:#0d1322;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px}
    .ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .ctrl-group{display:flex;flex-direction:column;gap:6px}
    .ctrl-label{font-size:0.62rem;font-weight:800;color:#2a3f52;text-transform:uppercase;letter-spacing:2px}
    .ctrl-input-wrap{display:flex;align-items:center;background:#070c18;border:1px solid rgba(255,255,255,0.08);border-radius:8px;overflow:hidden}
    .ctrl-input-wrap .ci-icon{padding:0 10px;color:#2a3f52;flex-shrink:0}
    .ctrl-input-wrap input{flex:1;background:none;border:none;color:#fff;font-size:0.95rem;font-weight:700;padding:11px 8px;outline:none;font-family:inherit;min-width:0}
    .ctrl-input-wrap input:focus{outline:none}
    .ctrl-input-wrap:focus-within{border-color:#00ff88}
    .mine-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .mine-presets button{background:#162232;border:1px solid rgba(255,255,255,0.07);color:#4a6375;border-radius:6px;padding:4px 8px;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .mine-presets button:hover{background:#1e3048;color:#fff}
    .bet-presets{display:flex;gap:6px;margin-top:6px}
    .bet-presets button{flex:1;background:#162232;border:1px solid rgba(255,255,255,0.07);color:#4a6375;border-radius:6px;padding:5px 0;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .bet-presets button:hover{background:#1e3048;color:#fff}
    .action-row{display:flex;gap:10px}
    .btn-start{flex:1;background:#00ff88;color:#000;border:none;border-radius:10px;padding:13px;font-size:0.9rem;font-weight:900;cursor:pointer;letter-spacing:1px;transition:all 0.15s;text-transform:uppercase}
    .btn-start:hover:not(:disabled){background:#30ffaa;transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,255,136,0.3)}
    .btn-start:disabled{background:#162232;color:#2a3f52;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-cashout{flex:1;background:linear-gradient(135deg,#f0c040,#f59e0b);color:#000;border:none;border-radius:10px;padding:13px;font-size:0.9rem;font-weight:900;cursor:pointer;letter-spacing:1px;transition:all 0.15s;display:none;text-transform:uppercase;animation:pulseGold 1.5s ease-in-out infinite}
    @keyframes pulseGold{0%,100%{box-shadow:0 0 10px rgba(240,192,64,0.3)}50%{box-shadow:0 0 25px rgba(240,192,64,0.6)}}
    .btn-cashout:hover{transform:translateY(-1px);filter:brightness(1.1)}
    /* Gem count pills */
    .gem-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;min-height:28px}
    .gem-pill{width:24px;height:24px;border-radius:6px;background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.3);display:flex;align-items:center;justify-content:center;animation:pillPop 0.3s cubic-bezier(0.34,1.56,0.64,1)}
    @keyframes pillPop{0%{transform:scale(0)}100%{transform:scale(1)}}
    .gem-pill svg{width:12px;height:12px}
  </style>
</head>
<body>
<div class="dungeon-bg"></div>
<script src="/casino-core.js"></script>
<script>Casino.renderSidebar('mines');Casino.requireAuth();</script>

<main class="casino-main">
<div class="dungeon-wrap">

  <div class="game-top-bar">
    <div class="game-top-title">
      <div class="icon-wrap">
        <svg viewBox="0 0 20 20" fill="none" width="20" height="20">
          <circle cx="10" cy="10" r="5" fill="#f1323f" opacity="0.9"/>
          <line x1="10" y1="2" x2="10" y2="5" stroke="#f1323f" stroke-width="2" stroke-linecap="round"/>
          <line x1="10" y1="15" x2="10" y2="18" stroke="#f1323f" stroke-width="2" stroke-linecap="round"/>
          <line x1="2" y1="10" x2="5" y2="10" stroke="#f1323f" stroke-width="2" stroke-linecap="round"/>
          <line x1="15" y1="10" x2="18" y2="10" stroke="#f1323f" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="4" x2="6.5" y2="6.5" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.5" y1="13.5" x2="16" y2="16" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="4" x2="13.5" y2="6.5" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="6.5" y1="13.5" x2="4" y2="16" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>DEEP DUNGEON</h1>
    </div>
    <div class="he-tag">House Edge <span id="heBadge">4%</span></div>
  </div>

  <!-- Multiplier bar -->
  <div class="mult-bar">
    <div class="mult-cell" id="mc-mult">
      <div class="mc-label">Multiplier</div>
      <div class="mc-val" id="multDisplay">1.00×</div>
    </div>
    <div class="mult-cell" id="mc-profit">
      <div class="mc-label">Profit if cashout</div>
      <div class="mc-val" id="profitDisplay">$0.00</div>
    </div>
    <div class="mult-cell">
      <div class="mc-label">Gems found</div>
      <div class="mc-val" id="gemsCount">—</div>
    </div>
  </div>

  <!-- Gem pills row -->
  <div class="gem-pills" id="gemPills"></div>

  <!-- Grid -->
  <div class="dungeon-grid" id="minesGrid"></div>

  <!-- Controls -->
  <div class="controls-wrap">
    <div class="ctrl-row">
      <div class="ctrl-group">
        <div class="ctrl-label">Bet Amount</div>
        <div class="ctrl-input-wrap">
          <span class="ci-icon" style="font-size:0.8rem;font-weight:700;color:#4a6375">$</span>
          <input type="number" id="betAmt" value="10" min="1">
        </div>
        <div class="bet-presets">
          <button onclick="qBet(5)">$5</button>
          <button onclick="qBet(10)">$10</button>
          <button onclick="qBet(25)">$25</button>
          <button onclick="qBet(100)">$100</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">Mine Count</div>
        <div class="ctrl-input-wrap">
          <span class="ci-icon">
            <svg viewBox="0 0 14 14" fill="none" width="14" height="14"><circle cx="7" cy="7" r="3.5" fill="#f1323f"/><line x1="7" y1="1" x2="7" y2="3" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="11" x2="7" y2="13" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="7" x2="3" y2="7" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="7" x2="13" y2="7" stroke="#f1323f" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <input type="number" id="minesCount" value="5" min="1" max="24" style="text-align:center">
        </div>
        <div class="mine-presets">
          <button onclick="setMines(1)">1</button>
          <button onclick="setMines(3)">3</button>
          <button onclick="setMines(5)">5</button>
          <button onclick="setMines(10)">10</button>
          <button onclick="setMines(15)">15</button>
          <button onclick="setMines(20)">20</button>
        </div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn-start" id="startBtn" onclick="startGame()">ENTER DUNGEON</button>
      <button class="btn-cashout" id="cashoutBtn" onclick="cashout()">COLLECT TREASURE</button>
    </div>
  </div>

</div>
</main>

<script>
const RUNES = ['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛇ','ᛈ','ᛉ','ᛊ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛜ','ᛞ','ᛟ','ᚦ'];

const GEM_SVG = `<svg viewBox="0 0 60 60" fill="none">
  <defs>
    <linearGradient id="cg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00ffcc"/><stop offset="0.5" stop-color="#00a8ff"/><stop offset="1" stop-color="#7b2fff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <polygon points="30,5 52,20 44,53 16,53 8,20" fill="url(#cg1)" filter="url(#glow)"/>
  <polygon points="30,5 52,20 30,17" fill="rgba(255,255,255,0.5)"/>
  <polygon points="8,20 52,20 30,17" fill="rgba(255,255,255,0.15)"/>
  <polygon points="30,53 16,53 22,35" fill="rgba(0,0,0,0.2)"/>
  <polygon points="30,53 44,53 38,35" fill="rgba(0,0,0,0.1)"/>
  <line x1="8" y1="20" x2="30" y2="17" stroke="rgba(255,255,255,0.6)" stroke-width="0.5"/>
  <circle cx="20" cy="30" r="2" fill="rgba(255,255,255,0.5)"/>
</svg>`;

const MINE_SVG = `<svg viewBox="0 0 60 60" fill="none">
  <defs><radialGradient id="mg" cx="40%" cy="35%" r="60%"><stop stop-color="#ff6b6b"/><stop offset="1" stop-color="#8b0000"/></radialGradient></defs>
  <circle cx="30" cy="32" r="16" fill="url(#mg)"/>
  <circle cx="30" cy="32" r="9" fill="#5a0000" opacity="0.8"/>
  <circle cx="27" cy="29" r="3" fill="rgba(255,150,150,0.4)"/>
  <line x1="30" y1="8" x2="30" y2="16" stroke="#ff4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="48" x2="30" y2="56" stroke="#ff4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="14" y2="32" stroke="#ff4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="54" y2="32" stroke="#ff4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="13" y1="13" x2="19" y2="19" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="41" x2="47" y2="47" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="13" x2="41" y2="19" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="19" y1="41" x2="13" y2="47" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="27" y="4" width="6" height="6" rx="2" fill="#ff6b6b"/>
</svg>`;

let gameActive = false, minePositions = new Set(), revealedTiles = new Set();
let currentBet = 0, currentMult = 1.0, bestMult = 0;
let balance = 0;

function getMult(gemsFound, totalMines) {
  let m = 1.0;
  for (let i = 0; i < gemsFound; i++) {
    const rem = 25 - i;
    m *= rem / (rem - totalMines);
  }
  return Math.round(m * 100) / 100;
}

function buildGrid() {
  const grid = document.getElementById('minesGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const tile = document.createElement('div');
    tile.className = 'd-tile';
    tile.id = 'tile-' + i;
    tile.innerHTML = `<div class="rune">${RUNES[i]}</div><div class="tile-inner"></div>`;
    tile.onclick = () => clickTile(i);
    grid.appendChild(tile);
  }
}

function startGame() {
  const bet = Math.max(1, parseFloat(document.getElementById('betAmt').value) || 10);
  const mines = Math.max(1, Math.min(24, parseInt(document.getElementById('minesCount').value) || 5));
  if (bet > balance) return;

  currentBet = bet; gameActive = true;
  revealedTiles.clear(); minePositions.clear();
  while (minePositions.size < mines) minePositions.add(Math.floor(Math.random() * 25));

  buildGrid();
  currentMult = 1.0;
  updateInfoBar(0);
  document.getElementById('gemPills').innerHTML = '';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('cashoutBtn').style.display = 'block';
  document.getElementById('betAmt').disabled = true;
  document.getElementById('minesCount').disabled = true;
  document.getElementById('mc-mult').classList.remove('active-mult');
}

function clickTile(idx) {
  if (!gameActive || revealedTiles.has(idx)) return;
  revealedTiles.add(idx);
  const tile = document.getElementById('tile-' + idx);
  tile.classList.add('disabled');

  if (minePositions.has(idx)) {
    tile.classList.add('mine');
    tile.querySelector('.tile-inner').innerHTML = MINE_SVG;
    tile.querySelector('.rune').style.display = 'none';
    spawnParticles(tile, '#ff4444', 12);
    revealAllMines();
    endGame(false);
  } else {
    tile.classList.add('gem');
    tile.querySelector('.tile-inner').innerHTML = GEM_SVG;
    tile.querySelector('.rune').style.display = 'none';
    spawnParticles(tile, '#00ff88', 6);
    addGemPill();
    const mines = minePositions.size;
    currentMult = getMult(revealedTiles.size, mines);
    if (currentMult > bestMult) bestMult = currentMult;
    updateInfoBar(revealedTiles.size);

    // Check if all gems found
    if (revealedTiles.size === 25 - mines) cashout();
  }
}

function addGemPill() {
  const pills = document.getElementById('gemPills');
  const pill = document.createElement('div');
  pill.className = 'gem-pill';
  pill.innerHTML = `<svg viewBox="0 0 12 12" fill="none"><polygon points="6,1 10.5,4 9,11 3,11 1.5,4" fill="#00ff88" opacity="0.9"/></svg>`;
  pills.appendChild(pill);
}

function revealAllMines() {
  minePositions.forEach(idx => {
    if (!revealedTiles.has(idx)) {
      const tile = document.getElementById('tile-' + idx);
      tile.classList.add('mine', 'disabled');
      tile.querySelector('.tile-inner').innerHTML = MINE_SVG;
      tile.querySelector('.rune').style.display = 'none';
    }
  });
}

async function cashout() {
  if (!gameActive || revealedTiles.size === 0) { endGame(false, true); return; }
  const won = Math.round(currentBet * currentMult * 100) / 100;
  try {
    const r = await fetch('/api/bet', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ game:'mines', wagered:currentBet, returned:won }) });
    if (r.ok) { const d = await r.json(); balance = d.balance; Casino.syncBalance(balance); }
  } catch {}
  flashResult(`+$${won.toFixed(2)} at ${currentMult}×`, true);
  endGame(true);
}

function endGame(won, cancelled = false) {
  gameActive = false;
  document.getElementById('cashoutBtn').style.display = 'none';
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('betAmt').disabled = false;
  document.getElementById('minesCount').disabled = false;
  document.getElementById('mc-mult').classList.remove('active-mult');

  if (!won && !cancelled) {
    try {
      fetch('/api/bet', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ game:'mines', wagered:currentBet, returned:0 }) })
        .then(r => r.ok && r.json().then(d => { balance = d.balance; Casino.syncBalance(balance); }));
    } catch {}
    flashResult(`Lost $${currentBet.toFixed(2)}`, false);
  }

  for (let i = 0; i < 25; i++) {
    const tile = document.getElementById('tile-' + i);
    if (tile) tile.classList.add('disabled');
  }
}

function updateInfoBar(gemsFound) {
  const profit = Math.max(0, Math.round((currentBet * currentMult - currentBet) * 100) / 100);
  document.getElementById('multDisplay').textContent = currentMult.toFixed(2) + '×';
  document.getElementById('profitDisplay').textContent = '$' + profit.toFixed(2);
  document.getElementById('gemsCount').textContent = gemsFound > 0 ? gemsFound : '—';
  if (gemsFound > 0) document.getElementById('mc-mult').classList.add('active-mult');
}

function flashResult(msg, won) {
  const el = document.getElementById('profitDisplay');
  el.textContent = msg;
  el.style.color = won ? '#00ff88' : '#f1323f';
  setTimeout(() => { el.style.color = ''; updateInfoBar(0); }, 2500);
}

function spawnParticles(tile, color, count) {
  const rect = tile.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 30 + Math.random() * 40;
    p.style.cssText = `left:${cx}px;top:${cy}px;width:${3+Math.random()*4}px;height:${3+Math.random()*4}px;background:${color};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation-duration:${0.5+Math.random()*0.4}s`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

function setMines(v) { if (!gameActive) document.getElementById('minesCount').value = v; }
function qBet(v) { if (!gameActive) document.getElementById('betAmt').value = Math.min(v, balance); }

// Load balance
fetch('/api/me').then(r=>r.json()).then(d=>{
  balance = d.balance;
  Casino.syncBalance(balance);
}).catch(()=>{});

// Rates
fetch('/api/rates').then(r=>r.json()).then(d=>{
