<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plinko — Obsidian Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<script src="/casino-core.js"></script>
<script>Casino.requireAuth()</script>

<div class="casino-layout">
  <div class="main-content">
    <div class="game-page-wrap" style="max-width:820px;margin:0 auto;padding:24px 16px">
      <div class="game-header">
        <div class="game-title-row">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="5" r="3" fill="#1475e1"/>
            <circle cx="8" cy="12" r="2.5" fill="#4a6375"/>
            <circle cx="20" cy="12" r="2.5" fill="#4a6375"/>
            <circle cx="5" cy="19" r="2" fill="#4a6375"/>
            <circle cx="14" cy="19" r="2" fill="#4a6375"/>
            <circle cx="23" cy="19" r="2" fill="#4a6375"/>
          </svg>
          <h1>PLINKO</h1>
        </div>
        <div class="house-edge-badge">House Edge <span id="heBadge">4.0%</span></div>
      </div>

      <div class="plinko-wrap">
        <!-- Canvas -->
        <div class="plinko-canvas-wrap">
          <canvas id="plinkoCanvas"></canvas>
        </div>

        <!-- Controls -->
        <div class="plinko-controls">
          <div class="ctrl-section">
            <label class="bet-label">BET AMOUNT</label>
            <div class="bet-input-row">
              <button class="half-btn" onclick="adj(0.5)">½</button>
              <input type="number" id="betInput" class="bet-input-large" value="10" min="1">
              <button class="double-btn" onclick="adj(2)">2×</button>
            </div>
            <div class="bet-presets">
              <button onclick="sb(5)">$5</button>
              <button onclick="sb(25)">$25</button>
              <button onclick="sb(100)">$100</button>
            </div>
          </div>

          <div class="ctrl-section">
            <label class="bet-label">ROWS</label>
            <div class="row-selector">
              <button class="row-btn" onclick="setRows(8)">8</button>
              <button class="row-btn active" onclick="setRows(12)">12</button>
              <button class="row-btn" onclick="setRows(16)">16</button>
            </div>
          </div>

          <div class="ctrl-section">
            <label class="bet-label">RISK</label>
            <div class="row-selector">
              <button class="row-btn active" onclick="setRisk('low')">Low</button>
              <button class="row-btn" onclick="setRisk('medium')">Med</button>
              <button class="row-btn" onclick="setRisk('high')">High</button>
            </div>
          </div>

          <div class="ctrl-section">
            <div class="balance-display">Balance: <strong id="balDisp">$0</strong></div>
          </div>

          <button class="action-btn btn-green" id="dropBtn" onclick="dropBall()">DROP BALL</button>

          <div class="plinko-result" id="result" style="display:none">
            <div id="resultMult"></div>
            <div id="resultAmt"></div>
          </div>

          <div class="plinko-history" id="historyList"></div>
        </div>
      </div>

      <!-- Bucket multipliers -->
      <div id="bucketsDisplay" class="buckets-row"></div>
    </div>
  </div>
</div>

<style>
.game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.game-title-row{display:flex;align-items:center;gap:10px}
.game-title-row h1{font-size:1.3rem;font-weight:900;letter-spacing:2px}
.house-edge-badge{background:rgba(20,117,225,0.1);border:1px solid rgba(20,117,225,0.2);color:#1475e1;font-size:0.72rem;font-weight:700;padding:4px 10px;border-radius:6px}
.plinko-wrap{display:flex;gap:16px;align-items:flex-start}
.plinko-canvas-wrap{flex:1;background:#0a1520;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;min-width:0}
#plinkoCanvas{display:block;width:100%}
.plinko-controls{width:180px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.ctrl-section{display:flex;flex-direction:column;gap:8px}
.bet-label{font-size:0.62rem;font-weight:800;color:#4a6375;text-transform:uppercase;letter-spacing:2px}
.bet-input-row{display:flex;align-items:center;gap:6px}
.bet-input-large{flex:1;background:#162232;border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:0.9rem;font-weight:700;padding:9px 10px;outline:none;font-family:inherit;min-width:0}
.bet-input-large:focus{border-color:#00c74d}
.half-btn,.double-btn{background:#162232;border:1px solid rgba(255,255,255,0.08);color:#8ea3b1;border-radius:6px;padding:7px 8px;font-size:0.75rem;font-weight:700;cursor:pointer}
.bet-presets{display:flex;gap:6px}
.bet-presets button{flex:1;background:#162232;border:1px solid rgba(255,255,255,0.07);color:#8ea3b1;border-radius:6px;padding:5px 0;font-size:0.7rem;font-weight:700;cursor:pointer}
.bet-presets button:hover{background:#1e3048;color:#fff}
.row-selector{display:flex;gap:4px}
.row-btn{flex:1;background:#162232;border:1px solid rgba(255,255,255,0.07);color:#4a6375;border-radius:6px;padding:6px 0;font-size:0.75rem;font-weight:700;cursor:pointer}
.row-btn.active{background:#00c74d;color:#000;border-color:#00c74d}
.row-btn:hover:not(.active){background:#1e3048;color:#8ea3b1}
.balance-display{background:#0a1520;border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 12px;font-size:0.78rem;color:#4a6375;text-align:center}
.balance-display strong{color:#fff}
.action-btn{border:none;border-radius:10px;padding:12px;font-size:0.85rem;font-weight:800;cursor:pointer;letter-spacing:0.5px;transition:all 0.15s;width:100%}
.btn-green{background:#00c74d;color:#000}
.btn-green:hover:not(:disabled){background:#00e858}
.btn-green:disabled{background:#1e3048;color:#4a6375;cursor:not-allowed}
.plinko-result{text-align:center;background:#0a1520;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px}
#resultMult{font-size:1.4rem;font-weight:900}
#resultAmt{font-size:0.8rem;color:#4a6375;margin-top:4px}
.plinko-history{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.hist-row{display:flex;justify-content:space-between;font-size:0.72rem;padding:4px 8px;background:#0a1520;border-radius:6px}
.buckets-row{display:flex;gap:3px;margin-top:8px;padding:0 4px}
.bucket{flex:1;text-align:center;padding:6px 2px;border-radius:6px;font-size:0.65rem;font-weight:800;letter-spacing:0.3px;transition:transform 0.1s}
.bucket.hit{animation:bucketHit 0.3s ease}
@keyframes bucketHit{0%{transform:scaleY(1.3)}50%{transform:scaleY(0.8)}100%{transform:scaleY(1)}}
@media(max-width:600px){.plinko-wrap{flex-direction:column}.plinko-controls{width:100%;flex-direction:row;flex-wrap:wrap}.ctrl-section{min-width:140px}}
</style>

<script>
const canvas = document.getElementById('plinkoCanvas');
const ctx = canvas.getContext('2d');

let rows = 12;
let risk = 'low';
let balance = 0;
let dropping = false;

// Multiplier tables [low, medium, high] for 8/12/16 rows
const MULTS = {
  8: {
    low:    [5.6, 2.1, 1.1, 1.0, 0.5, 1.0, 1.1, 2.1, 5.6],
    medium: [13,  3,   1.3, 0.7, 0.4, 0.7, 1.3, 3,   13],
    high:   [29,  4,   1.5, 0.3, 0.2, 0.3, 1.5, 4,   29],
  },
  12: {
    low:    [8.9, 3,   1.4, 1.1, 1.0, 0.5, 0.5, 1.0, 1.1, 1.4, 3,   8.9],
    medium: [33,  11,  4,   2,   1.1, 0.6, 0.6, 1.1, 2,   4,   11,  33],
    high:   [88,  18,  4,   2,   1.2, 0.3, 0.3, 1.2, 2,   4,   18,  88],
  },
  16: {
    low:    [16,  9,   2,   1.4, 1.4, 1.2, 1.1, 1.0, 0.5, 1.0, 1.1, 1.2, 1.4, 1.4, 2, 9, 16],
    medium: [110, 41,  10,  5,   3,   1.5, 1.0, 0.5, 0.3, 0.5, 1.0, 1.5, 3,   5,   10,41,110],
    high:   [1000,130, 26,  9,   4,   2,   0.9, 0.3, 0.2, 0.3, 0.9, 2,   4,   9,   26,130,1000],
  },
};

function getMults() { return MULTS[rows][risk]; }

function bucketColor(mult) {
  if (mult >= 10) return '#f1323f';
  if (mult >= 3) return '#f59e0b';
  if (mult >= 1.5) return '#f0c040';
  if (mult >= 1) return '#00c74d';
  return '#4a6375';
}

// Canvas sizing
const PAD = 20;
let PEG_R = 4;
let BALL_R = 7;

function canvasSize() {
  const w = canvas.parentElement.clientWidth || 600;
  canvas.width = w;
  const cols = rows + 1;
  const spacing = (w - PAD * 2) / (cols - 1);
  const H = PAD * 2 + (rows - 1) * spacing + 60;
  canvas.height = H;
  return { w, spacing, cols };
}

function getPegPos(row, col) {
  const { w, spacing } = canvasSize();
  const cols = row + 2;
  const totalW = (cols - 1) * spacing;
  const startX = (w - totalW) / 2;
  const y = PAD + row * spacing;
  const x = startX + col * spacing;
  return { x, y };
}

function drawBoard(balls = []) {
  const { w, spacing } = canvasSize();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Pegs
  for (let r = 0; r < rows; r++) {
    const cols = r + 2;
    for (let c = 0; c < cols; c++) {
      const { x, y } = getPegPos(r, c);
      ctx.beginPath();
      ctx.arc(x, y, PEG_R, 0, Math.PI * 2);
      ctx.fillStyle = '#1e3048';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // Balls
  for (const ball of balls) {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, BALL_R);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#1475e1');
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

function renderBuckets() {
  const mults = getMults();
  const display = document.getElementById('bucketsDisplay');
  display.innerHTML = mults.map((m, i) => {
    const col = bucketColor(m);
    return `<div class="bucket" id="bucket-${i}" style="background:${col}20;color:${col};border:1px solid ${col}40">${m >= 100 ? m + 'x' : m + 'x'}</div>`;
  }).join('');
}

// Simulate ball drop
function simulatePath() {
  const mults = getMults();
  let pos = 0; // position among pegs in bottom row (0 = leftmost)
  const steps = [];
  for (let r = 0; r < rows; r++) {
    const goRight = Math.random() < 0.5;
    if (goRight) pos++;
    steps.push({ row: r, col: pos, goRight });
  }
  // final bucket index
  const bucketIdx = pos;
  return { steps, bucketIdx, mult: mults[Math.min(bucketIdx, mults.length - 1)] };
}

// Animate ball
async function animateBall(steps, bucketIdx) {
  return new Promise(resolve => {
    const { w, spacing } = canvasSize();
    // Start position: above first row, centered
    const cols0 = 2;
    const startX = w / 2;
    const startY = PAD - spacing * 0.6;

    const ball = { x: startX, y: startY };
    const balls = [ball];
    let stepIdx = 0;

    function getTargetForStep(s) {
      if (s >= steps.length) {
        // Bucket position
        const mults = getMults();
        const numBuckets = mults.length;
        const totalPegs = rows + 1;
        const totalW = (totalPegs - 1) * spacing;
        const startX2 = (w - totalW) / 2;
        const bW = totalW / (numBuckets - 1);
        const bIdx = Math.min(bucketIdx, numBuckets - 1);
        return { x: startX2 + bIdx * bW, y: canvas.height - 20 };
      }
      const { row, col } = steps[s];
      return getPegPos(row, col);
    }

    function tick() {
      const target = getTargetForStep(stepIdx);
      const dx = target.x - ball.x;
      const dy = target.y - ball.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const speed = Math.max(4, dist * 0.18);

      if (dist < speed + 1) {
        ball.x = target.x;
        ball.y = target.y;
        stepIdx++;
        if (stepIdx > steps.length) {
          drawBoard(balls);
          setTimeout(resolve, 80);
          return;
        }
      } else {
        ball.x += (dx / dist) * speed;
        ball.y += (dy / dist) * speed;
      }

      drawBoard(balls);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function setRows(r) {
  rows = r;
  document.querySelectorAll('.row-btn').forEach(b => {
    if (b.textContent === String(r)) b.classList.add('active');
    else if (['8','12','16'].includes(b.textContent)) b.classList.remove('active');
  });
  canvasSize();
  drawBoard();
  renderBuckets();
}

function setRisk(r) {
  risk = r;
  const labels = { low: 'Low', medium: 'Med', high: 'High' };
  document.querySelectorAll('.row-btn').forEach(b => {
    if (b.textContent === labels[r]) b.classList.add('active');
    else if (['Low','Med','High'].includes(b.textContent)) b.classList.remove('active');
  });
  drawBoard();
  renderBuckets();
}

function sb(v) { document.getElementById('betInput').value = v; }
function adj(f) {
  const inp = document.getElementById('betInput');
  inp.value = Math.max(1, Math.round(parseFloat(inp.value || 1) * f));
}

async function loadBalance() {
  try {
    const r = await fetch('/api/me');
    if (r.ok) { const d = await r.json(); balance = d.balance; updateBal(); }
  } catch {}
}

function updateBal() {
  document.getElementById('balDisp').textContent = '$' + balance.toFixed(2);
}

async function dropBall() {
  if (dropping) return;
  const bet = parseFloat(document.getElementById('betInput').value);
  if (!bet || bet <= 0 || bet > balance) return;

  dropping = true;
  document.getElementById('dropBtn').disabled = true;
  document.getElementById('result').style.display = 'none';

  const { steps, bucketIdx, mult } = simulatePath();
  const returned = Math.round(bet * mult * 100) / 100;

  await animateBall(steps, bucketIdx);

  // Highlight bucket
  const bucketEl = document.getElementById('bucket-' + bucketIdx);
  if (bucketEl) bucketEl.classList.add('hit');
  setTimeout(() => bucketEl?.classList.remove('hit'), 400);

  // Update balance via API
  try {
    const r = await fetch('/api/bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game: 'plinko', wagered: bet, returned })
    });
    if (r.ok) {
      const d = await r.json();
      balance = d.balance;
      updateBal();
    }
  } catch {}

  const net = returned - bet;
  const resEl = document.getElementById('result');
  const multEl = document.getElementById('resultMult');
  const amtEl = document.getElementById('resultAmt');
  resEl.style.display = 'block';
  multEl.textContent = mult + 'x';
  multEl.style.color = net >= 0 ? '#00c74d' : '#f1323f';
  amtEl.textContent = (net >= 0 ? '+' : '') + '$' + net.toFixed(2);

  // History
  addHistory(bet, returned, mult);
  Casino.syncBalance && Casino.syncBalance(balance);

  dropping = false;
  document.getElementById('dropBtn').disabled = false;
}

function addHistory(wagered, returned, mult) {
  const net = returned - wagered;
  const list = document.getElementById('historyList');
  const row = document.createElement('div');
  row.className = 'hist-row';
  row.innerHTML = `<span style="color:${net>=0?'#00c74d':'#f1323f'};font-weight:700">${mult}x</span><span style="color:${net>=0?'#00c74d':'#f1323f'}">${net>=0?'+':''}$${net.toFixed(2)}</span>`;
  list.insertBefore(row, list.firstChild);
  while (list.children.length > 20) list.removeChild(list.lastChild);
}

// Rates
fetch('/api/rates').then(r=>r.json()).then(d=>{
  if (d.plinko?.house_edge !== undefined) document.getElementById('heBadge').textContent = (d.plinko.house_edge*100).toFixed(1)+'%';
}).catch(()=>{});

// Init
canvasSize();
drawBoard();
renderBuckets();
loadBalance();
window.addEventListener('resize', () => { canvasSize(); drawBoard(); renderBuckets(); });
</script>
</body>
</html>
