<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Drop — Obsidian Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .gd-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#0d0520 0%,#060210 55%,#020008 100%);z-index:-1;overflow:hidden}
    .gd-bg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1px 1px at 15% 25%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(1px 1px at 75% 8%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(2px 2px at 35% 60%,rgba(180,140,255,0.25) 0%,transparent 100%),radial-gradient(1px 1px at 55% 82%,rgba(255,255,255,0.35) 0%,transparent 100%),radial-gradient(1px 1px at 5% 90%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(2px 2px at 88% 72%,rgba(140,100,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 48% 18%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(1px 1px at 92% 45%,rgba(255,255,255,0.25) 0%,transparent 100%),radial-gradient(1px 1px at 28% 45%,rgba(200,180,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 65% 35%,rgba(255,255,255,0.2) 0%,transparent 100%);background-size:500px 400px}
    .gd-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(80,40,200,0.04) 0%,transparent 65%)}

    .gd-wrap{max-width:830px;margin:0 auto;padding:24px 16px}
    .gd-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .gd-title-row{display:flex;align-items:center;gap:12px}
    .gd-icon{width:44px;height:44px;background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center}
    .gd-title-row h1{font-size:1.3rem;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#c4b5fd,#7c3aed,#4f46e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .he-pill{background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.25);color:#a78bfa;font-size:0.7rem;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:1px}

    .gd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
    .gd-stat{background:rgba(12,4,28,0.85);border:1px solid rgba(139,92,246,0.1);border-radius:10px;padding:10px;text-align:center}
    .gd-stat .sv{font-size:1rem;font-weight:800;color:#fff}
    .gd-stat .sl{font-size:0.6rem;color:#3d2060;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}

    .gd-layout{display:grid;grid-template-columns:1fr 215px;gap:14px;align-items:start}

    .gd-canvas-wrap{border:1px solid rgba(139,92,246,0.2);border-radius:20px;overflow:hidden;position:relative;cursor:pointer;background:#020008}
    #dropCanvas{display:block;width:100%}
    .canvas-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 0.3s}
    .overlay-content{text-align:center}
    .overlay-big{font-size:1.1rem;font-weight:900;color:rgba(196,181,253,0.85);letter-spacing:4px;text-shadow:0 0 20px rgba(139,92,246,0.6)}
    .overlay-sub{font-size:0.68rem;color:rgba(139,92,246,0.5);margin-top:5px;letter-spacing:3px}

    .drop-hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
    .hud-cell{background:rgba(12,4,28,0.85);border:1px solid rgba(139,92,246,0.1);border-radius:8px;padding:8px;text-align:center}
    .hud-cell .hv{font-size:0.9rem;font-weight:800}
    .hud-cell .hl{font-size:0.55rem;color:#3d2060;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}

    .gd-ctrl{background:rgba(12,4,28,0.92);border:1px solid rgba(139,92,246,0.15);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
    .ctrl-lbl{font-size:0.6rem;font-weight:800;color:#3d2060;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
    .bet-row{display:flex;gap:6px;align-items:center}
    .bet-inp{flex:1;background:#040012;border:1px solid rgba(139,92,246,0.2);border-radius:8px;color:#fff;font-size:0.95rem;font-weight:700;padding:10px;outline:none;font-family:inherit;min-width:0}
    .bet-inp:focus{border-color:#7c3aed}
    .fadj{background:#0a0520;border:1px solid rgba(139,92,246,0.1);color:#4a3060;border-radius:6px;padding:8px 10px;font-size:0.75rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .fadj:hover{background:#160840;color:#a78bfa}
    .presets{display:flex;gap:5px;flex-wrap:wrap}
    .presets button{background:#040012;border:1px solid rgba(139,92,246,0.08);color:#4a3060;border-radius:6px;padding:5px 0;font-size:0.7rem;font-weight:700;cursor:pointer;flex:1;transition:all 0.15s}
    .presets button:hover{background:#0a0520;color:#a78bfa}

    .drop-btn{width:100%;padding:14px;background:linear-gradient(135deg,#4c1d95,#7c3aed,#a855f7);border:none;border-radius:12px;color:#fff;font-size:0.95rem;font-weight:900;cursor:pointer;letter-spacing:2px;transition:all 0.15s;text-transform:uppercase;position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,0.15)}
    .drop-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.1) 0%,transparent 50%);pointer-events:none}
    .drop-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(124,58,237,0.55)}
    .drop-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}

    .result-box{background:#040012;border:1px solid rgba(139,92,246,0.12);border-radius:10px;padding:12px;text-align:center;min-height:64px}
    .result-mult{font-size:1.6rem;font-weight:900;line-height:1.1}
    .result-detail{font-size:0.68rem;color:#4a3060;margin-top:5px;line-height:1.5}

    .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .legend-row{display:flex;align-items:center;gap:7px;font-size:0.68rem;font-weight:700;color:#5a4070;padding:4px 0}
    .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

    .hist-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
    .hchip{padding:3px 8px;border-radius:10px;font-size:0.68rem;font-weight:800}
    .hw{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.25)}
    .hl{background:rgba(241,50,63,0.1);color:#f1323f;border:1px solid rgba(241,50,63,0.2)}

    @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,4px)}80%{transform:translate(4px,-2px)}}
    .shaking{animation:shake 0.22s ease}

    @media(max-width:620px){.gd-layout{grid-template-columns:1fr}.gd-stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="gd-bg"></div>
<script src="/casino-core.js"></script>
<script>Casino.renderSidebar('ropecut');Casino.requireAuth();</script>

<main class="casino-main">
<div class="gd-wrap">

  <div class="gd-header">
    <div class="gd-title-row">
      <div class="gd-icon">
        <svg viewBox="0 0 24 24" fill="none" width="24" height="24">
          <circle cx="12" cy="5" r="3.5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
          <path d="M12 8.5 L8 20 L12 16 L16 20 Z" fill="#7c3aed"/>
          <path d="M10 8 Q6 11 4 16 M14 8 Q18 11 20 16" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="4" cy="16" r="1.5" fill="#f0c040" opacity="0.8"/>
          <circle cx="20" cy="16" r="1.5" fill="#f1323f" opacity="0.8"/>
        </svg>
      </div>
      <h1>GRAVITY DROP</h1>
    </div>
    <span class="he-pill">HOUSE 4%</span>
  </div>

  <div class="gd-stats">
    <div class="gd-stat"><div class="sv" id="st-bal">—</div><div class="sl">Balance</div></div>
    <div class="gd-stat"><div class="sv" id="st-rounds">0</div><div class="sl">Rounds</div></div>
    <div class="gd-stat"><div class="sv" id="st-best">—</div><div class="sl">Best Win</div></div>
    <div class="gd-stat"><div class="sv" id="st-pl" style="color:var(--text2)">$0</div><div class="sl">Session P/L</div></div>
  </div>

  <div class="gd-layout">
    <div>
      <div class="gd-canvas-wrap" id="canvasWrap" onclick="tryDrop()">
        <canvas id="dropCanvas" width="530" height="650"></canvas>
        <div class="canvas-overlay" id="overlayMsg">
          <div class="overlay-content">
            <div class="overlay-big">DROP THE BALL</div>
            <div class="overlay-sub">CLICK TO LAUNCH</div>
          </div>
        </div>
      </div>

      <div class="drop-hud">
        <div class="hud-cell"><div class="hv" id="hud-coins" style="color:#f0c040">0</div><div class="hl">Coins</div></div>
        <div class="hud-cell"><div class="hv" id="hud-bombs" style="color:#f1323f">0</div><div class="hl">Bombs</div></div>
        <div class="hud-cell"><div class="hv" id="hud-bonus" style="color:#a78bfa">+0.00×</div><div class="hl">Bonus</div></div>
        <div class="hud-cell"><div class="hv" id="hud-shield" style="color:#4a3060">—</div><div class="hl">Shield</div></div>
      </div>

      <div class="hist-row" id="histRow"></div>
    </div>

    <div class="gd-ctrl">
      <div>
        <div class="ctrl-lbl">Bet Amount</div>
        <div class="bet-row">
          <input class="bet-inp" type="number" id="betAmt" value="50" min="1">
          <button class="fadj" onclick="adjBet(0.5)">½</button>
          <button class="fadj" onclick="adjBet(2)">2×</button>
        </div>
        <div class="presets" style="margin-top:6px">
          <button onclick="qBet(10)">$10</button>
          <button onclick="qBet(25)">$25</button>
          <button onclick="qBet(100)">$100</button>
          <button onclick="qBet(500)">$500</button>
        </div>
      </div>

      <div class="result-box">
        <div class="result-mult" id="resultMult" style="color:#4a3060">—</div>
        <div class="result-detail" id="resultDetail">Launch the ball to play</div>
      </div>

      <button class="drop-btn" id="dropBtn" onclick="tryDrop()" disabled>↓ LAUNCH BALL</button>

      <div>
        <div class="ctrl-lbl">Items</div>
        <div class="legend-grid">
          <div class="legend-row"><div class="legend-dot" style="background:#f0c040;box-shadow:0 0 4px #f0c040"></div>Coin +0.15×</div>
          <div class="legend-row"><div class="legend-dot" style="background:#f1323f;box-shadow:0 0 4px #f1323f"></div>Bomb ×0.55</div>
          <div class="legend-row"><div class="legend-dot" style="background:#ffd700;box-shadow:0 0 6px #ffd700"></div>Star +0.5×</div>
          <div class="legend-row"><div class="legend-dot" style="background:#60a8ff;box-shadow:0 0 5px #60a8ff"></div>Shield 🛡</div>
        </div>
      </div>
    </div>
  </div>

</div>
</main>

<script>
const canvas = document.getElementById('dropCanvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;

const BALL_R = 12;
const ITEM_R  = 13;
const ZONE_H  = 58;
const ZONE_Y  = CH - ZONE_H;
const TOP_PAD = 55;
const BOT_PAD = CH - ZONE_H - 15;

const ZONES = [
  {mult:0,   c:'#0d0520', bc:'#2a0060', tc:'#442260', lbl:'0×'},
  {mult:0.2, c:'#1a0808', bc:'#560018', tc:'#cc2040', lbl:'0.2×'},
  {mult:0.5, c:'#1a1200', bc:'#443400', tc:'#f59e0b', lbl:'0.5×'},
  {mult:1.5, c:'#0a1800', bc:'#1e4000', tc:'#88ee00', lbl:'1.5×'},
  {mult:3.0, c:'#001a0a', bc:'#005020', tc:'#00cc66', lbl:'3×'},
  {mult:5.5, c:'#001510', bc:'#004438', tc:'#00ff88', lbl:'5.5×'},
  {mult:3.0, c:'#001a0a', bc:'#005020', tc:'#00cc66', lbl:'3×'},
  {mult:1.5, c:'#0a1800', bc:'#1e4000', tc:'#88ee00', lbl:'1.5×'},
  {mult:0.5, c:'#1a1200', bc:'#443400', tc:'#f59e0b', lbl:'0.5×'},
  {mult:0.2, c:'#1a0808', bc:'#560018', tc:'#cc2040', lbl:'0.2×'},
  {mult:0,   c:'#0d0520', bc:'#2a0060', tc:'#442260', lbl:'0×'},
];

const zW = CW / ZONES.length;
const zPos = ZONES.map((z, i) => ({...z, x: i * zW, w: zW}));

let ball = null, items = [], particles = [];
let animId = null, phase = 'idle';
let balance = 0, balanceReady = false;
let rounds = 0, sessionPL = 0, bestWin = 0, history = [];
let currentBet = 0, landedZone = -1, frameCount = 0;
let coinsHit = 0, bombsHit = 0, coinBonus = 0, bombMult = 1, shieldActive = false, starMult = 1;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = 0 | (Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateItems() {
  items = [];
  const types = shuffle([
    ...Array(13).fill('coin'),
    ...Array(7).fill('bomb'),
    ...Array(3).fill('star'),
    ...Array(2).fill('shield'),
  ]);
  const MARGIN = 30;
  for (const type of types) {
    for (let a = 0; a < 200; a++) {
      const x = MARGIN + Math.random() * (CW - MARGIN * 2);
      const y = TOP_PAD + Math.random() * (BOT_PAD - TOP_PAD);
      if (items.every(it => Math.hypot(it.x - x, it.y - y) > 38)) {
        items.push({type, x, y, collected:false, fade:1, phase:Math.random()*Math.PI*2});
        break;
      }
    }
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i / n) + Math.random() * 0.6;
    const s = 2 + Math.random() * 3;
    particles.push({x, y, color, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 0.5, life:30+Math.random()*15|0, ml:45, r:2+Math.random()*2.5});
  }
}

// ── Draw helpers ───────────────────────────────────────────────────────────────
function drawStar(cx, cy, pts, R, r, fill, dark) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? R : r;
    i === 0 ? ctx.moveTo(cx + Math.cos(a)*rad, cy + Math.sin(a)*rad)
            : ctx.lineTo(cx + Math.cos(a)*rad, cy + Math.sin(a)*rad);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(cx-3, cy-3, 1, cx, cy, R);
  g.addColorStop(0, '#fffacd');
  g.addColorStop(0.5, fill);
  g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawBg() {
  const bg = ctx.createLinearGradient(0, 0, 0, CH);
  bg.addColorStop(0, '#07021a');
  bg.addColorStop(0.6, '#040112');
  bg.addColorStop(1, '#020008');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, CW, CH);
  // Grid lines
  ctx.strokeStyle = 'rgba(100,60,180,0.045)';
  ctx.lineWidth = 1;
  for (let x = 0; x < CW; x += 38) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
  for (let y = 0; y < CH; y += 38) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
}

function drawZones(hi) {
  zPos.forEach((z, i) => {
    const glow = i === hi;
    ctx.fillStyle = glow ? z.bc : z.c;
    ctx.strokeStyle = glow ? z.tc : z.bc;
    ctx.lineWidth = glow ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(z.x+1, ZONE_Y, z.w-2, ZONE_H-2, [0,0,5,5]);
    if (glow) { ctx.shadowColor = z.tc; ctx.shadowBlur = 18; }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.fillStyle = glow ? '#fff' : z.tc;
    ctx.font = `700 ${z.mult >= 3 ? 11 : 10}px Inter,sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(z.lbl, z.x + z.w/2, ZONE_Y + ZONE_H/2 + 4);
  });
}

function drawItems() {
  const t = frameCount * 0.05;
  ctx.textBaseline = 'middle';
  for (const item of items) {
    if (item.collected) {
      item.fade -= 0.09;
      if (item.fade <= 0) continue;
      ctx.globalAlpha = Math.max(0, item.fade);
    }
    const pulse = Math.sin(t + item.phase) * 0.35 + 0.65;

    if (item.type === 'coin') {
      ctx.shadowColor = '#f0c040'; ctx.shadowBlur = 10 * pulse;
      ctx.beginPath(); ctx.arc(item.x, item.y, ITEM_R, 0, Math.PI*2);
      const cg = ctx.createRadialGradient(item.x-3, item.y-3, 1, item.x, item.y, ITEM_R);
      cg.addColorStop(0,'#fef3c7'); cg.addColorStop(0.5,'#f0c040'); cg.addColorStop(1,'#92400e');
      ctx.fillStyle = cg; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(80,40,0,0.9)'; ctx.font = 'bold 8px Inter,sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('◆', item.x, item.y);

    } else if (item.type === 'bomb') {
      ctx.shadowColor = '#f1323f'; ctx.shadowBlur = 14 * pulse;
      ctx.beginPath(); ctx.arc(item.x, item.y, ITEM_R+1, 0, Math.PI*2);
      const bg2 = ctx.createRadialGradient(item.x-3, item.y-3, 1, item.x, item.y, ITEM_R+1);
      bg2.addColorStop(0,'#ff7080'); bg2.addColorStop(0.6,'#dc1828'); bg2.addColorStop(1,'#600010');
      ctx.fillStyle = bg2; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,200,210,0.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(item.x-4, item.y-4); ctx.lineTo(item.x+4, item.y+4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(item.x+4, item.y-4); ctx.lineTo(item.x-4, item.y+4); ctx.stroke();
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(item.x+4, item.y-ITEM_R+1);
      ctx.quadraticCurveTo(item.x+9, item.y-ITEM_R-4, item.x+7, item.y-ITEM_R-9);
      ctx.stroke();

    } else if (item.type === 'star') {
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 16 * pulse;
      drawStar(item.x, item.y, 5, ITEM_R+2, (ITEM_R+2)*0.42, '#ffd700', '#a06000');
      ctx.shadowBlur = 0;

    } else if (item.type === 'shield') {
      ctx.shadowColor = '#60a8ff'; ctx.shadowBlur = 10 * pulse;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = (k/6)*Math.PI*2 - Math.PI/6;
        k === 0 ? ctx.moveTo(item.x+Math.cos(a)*ITEM_R, item.y+Math.sin(a)*ITEM_R)
                : ctx.lineTo(item.x+Math.cos(a)*ITEM_R, item.y+Math.sin(a)*ITEM_R);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(50,80,220,${0.3+0.2*pulse})`; ctx.fill();
      ctx.strokeStyle = '#60a8ff'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.font = '11px serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#90c8ff'; ctx.fillText('🛡', item.x, item.y);
    }
    ctx.globalAlpha = 1;
  }
  ctx.textBaseline = 'alphabetic';
}

function drawBall() {
  if (!ball) return;
  // Trail
  if (ball.trail) {
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i];
      const alpha = (i / ball.trail.length) * 0.25;
      const r = BALL_R * (0.3 + 0.5 * i / ball.trail.length);
      ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(124,58,237,${alpha})`; ctx.fill();
    }
  }
  ctx.shadowColor = '#c4b5fd'; ctx.shadowBlur = 22;
  const bg = ctx.createRadialGradient(ball.x-3, ball.y-4, 1, ball.x, ball.y, BALL_R);
  bg.addColorStop(0,'#e9d5ff'); bg.addColorStop(0.5,'#7c3aed'); bg.addColorStop(1,'#2e1065');
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fillStyle = bg; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(ball.x-3, ball.y-3, 4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
}

function drawDropGuide() {
  if (phase !== 'idle') return;
  const mx = CW/2;
  ctx.strokeStyle = 'rgba(139,92,246,0.3)';
  ctx.setLineDash([4, 7]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(mx, 18); ctx.lineTo(mx, ZONE_Y-14); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(139,92,246,0.45)';
  ctx.beginPath();
  ctx.moveTo(mx, ZONE_Y-6);
  ctx.lineTo(mx-6, ZONE_Y-18);
  ctx.lineTo(mx+6, ZONE_Y-18);
  ctx.closePath(); ctx.fill();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.ml;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.life/p.ml), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function fullDraw() {
  frameCount++;
  drawBg();
  drawZones(phase === 'done' ? landedZone : -1);
  drawDropGuide();
  drawItems();
  drawParticles();
  drawBall();
}

// ── Physics / update ──────────────────────────────────────────────────────────
function update() {
  if (!ball || phase !== 'dropping') return;

  if (!ball.trail) ball.trail = [];
  ball.trail.unshift({x: ball.x, y: ball.y});
  if (ball.trail.length > 9) ball.trail.pop();

  ball.vy += 0.36;
  if (ball.vy > 11) ball.vy = 11;
  ball.vx += (Math.random() - 0.5) * 0.1;
  ball.vx *= 0.992;
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x < BALL_R + 2) { ball.x = BALL_R + 2; ball.vx = Math.abs(ball.vx) * 0.65; }
  if (ball.x > CW - BALL_R - 2) { ball.x = CW - BALL_R - 2; ball.vx = -Math.abs(ball.vx) * 0.65; }

  for (const item of items) {
    if (item.collected) continue;
    const dist = Math.hypot(ball.x - item.x, ball.y - item.y);
    if (dist < BALL_R + ITEM_R + 1) {
      item.collected = true;
      item.fade = 1;
      const dx = (ball.x - item.x) / (dist || 1);
      const dy = (ball.y - item.y) / (dist || 1);
      ball.vx += dx * 1.8;
      ball.vx = Math.max(-5, Math.min(5, ball.vx));

      if (item.type === 'coin') {
        coinBonus += 0.15 * starMult;
        coinsHit++;
        spawnParticles(item.x, item.y, '#f0c040', 8);
      } else if (item.type === 'bomb') {
        if (shieldActive) {
          shieldActive = false;
          spawnParticles(item.x, item.y, '#60a8ff', 10);
        } else {
          bombMult *= 0.55;
          bombsHit++;
          spawnParticles(item.x, item.y, '#f1323f', 14);
          const w = document.getElementById('canvasWrap');
          w.classList.remove('shaking'); void w.offsetWidth; w.classList.add('shaking');
        }
      } else if (item.type === 'star') {
        coinBonus += 0.5;
        starMult = 2;
        spawnParticles(item.x, item.y, '#ffd700', 14);
      } else if (item.type === 'shield') {
        shieldActive = true;
        spawnParticles(item.x, item.y, '#60a8ff', 10);
      }
      updateHUD();
    }
  }

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.95; p.life--; }
  particles = particles.filter(p => p.life > 0);

  if (ball.y + BALL_R >= ZONE_Y) {
    let zone = ZONES.length - 1;
    for (let i = 0; i < zPos.length; i++) {
      if (ball.x >= zPos[i].x && ball.x < zPos[i].x + zPos[i].w) { zone = i; break; }
    }
    landedZone = zone;
    onLanded(zone);
  }
}

function updateHUD() {
  document.getElementById('hud-coins').textContent = coinsHit;
  document.getElementById('hud-bombs').textContent = bombsHit;
  document.getElementById('hud-bonus').textContent = '+' + coinBonus.toFixed(2) + '×';
  const sh = document.getElementById('hud-shield');
  sh.textContent = shieldActive ? '🛡 ON' : '—';
  sh.style.color = shieldActive ? '#60a8ff' : '#4a3060';
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function mainLoop() {
  update();
  fullDraw();
  if (phase === 'dropping') animId = requestAnimationFrame(mainLoop);
}

function idleLoop() {
  fullDraw();
  if (phase === 'idle') animId = requestAnimationFrame(idleLoop);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function startIdle() {
  phase = 'idle'; ball = null; landedZone = -1;
  generateItems();
  coinsHit = 0; bombsHit = 0; coinBonus = 0; bombMult = 1; shieldActive = false; starMult = 1;
  updateHUD();
  document.getElementById('overlayMsg').style.opacity = '1';
  document.getElementById('dropBtn').disabled = !balanceReady;
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(idleLoop);
}

function tryDrop() {
  if (phase !== 'idle' || !balanceReady) return;
  const bet = parseFloat(document.getElementById('betAmt').value) || 0;
  if (bet <= 0 || bet > balance) return;
  currentBet = bet;
  phase = 'dropping';
  document.getElementById('overlayMsg').style.opacity = '0';
  document.getElementById('dropBtn').disabled = true;
  ball = { x: CW/2 + (Math.random()-0.5)*60, y:22, vx:(Math.random()-0.5)*2.5, vy:3, trail:[] };
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(mainLoop);
}

async function onLanded(zoneIdx) {
  phase = 'done';
  cancelAnimationFrame(animId);
  const zoneMult = ZONES[zoneIdx].mult;
  const rawMult = Math.max(0, (zoneMult + coinBonus) * bombMult);
  const finalMult = Math.round(rawMult * 0.96 * 100) / 100;
  const returned = Math.round(currentBet * finalMult * 100) / 100;
  const net = returned - currentBet;

  spawnParticles(ball.x, ZONE_Y, net >= 0 ? '#00ff88' : '#f1323f', 18);
  fullDraw();

  const rmEl = document.getElementById('resultMult');
  const rdEl = document.getElementById('resultDetail');
  rmEl.textContent = finalMult.toFixed(2) + '×';
  rmEl.style.color = finalMult >= 3 ? '#00ff88' : finalMult >= 1 ? '#f0c040' : '#f1323f';
  rdEl.innerHTML = `Zone ${zoneMult}× + Coins +${coinBonus.toFixed(2)}× × Bomb ${bombMult.toFixed(2)}<br><strong style="color:${net>=0?'#00ff88':'#f1323f'}">${net>=0?'+':''}$${returned.toFixed(2)}</strong>`;
  Casino.showToast(net);

  rounds++;
  sessionPL += net;
  if (returned > bestWin) bestWin = returned;
  history.unshift(net >= 0 ? 'w' : 'l');
  if (history.length > 20) history.pop();

  try {
    const r = await fetch('/api/bet', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({game:'ropecut', wagered:currentBet, returned})
    });
    if (r.ok) { const d = await r.json(); balance = d.balance; Casino.syncBalance(balance); }
  } catch {}

  updateStats();
  document.getElementById('histRow').innerHTML = history.map(h => `<span class="hchip h${h}">${h==='w'?'WIN':'LOSS'}</span>`).join('');
  setTimeout(startIdle, 2600);
}

function updateStats() {
  document.getElementById('st-bal').textContent = Casino.fmt(balance);
  document.getElementById('st-rounds').textContent = rounds;
  document.getElementById('st-best').textContent = bestWin > 0 ? Casino.fmt(bestWin) : '—';
  const pl = document.getElementById('st-pl');
  pl.textContent = (sessionPL >= 0 ? '+' : '') + Casino.fmt(sessionPL);
  pl.style.color = sessionPL > 0 ? 'var(--green)' : sessionPL < 0 ? 'var(--red)' : 'var(--text2)';
}

function adjBet(m) {
  const inp = document.getElementById('betAmt');
  inp.value = Math.max(1, Math.min(Math.round(parseFloat(inp.value||0)*m), balance));
}
function qBet(v) { document.getElementById('betAmt').value = Math.min(v, balance); }

fetch('/api/me').then(r=>r.json()).then(d=>{
  balance = d.balance; balanceReady = true;
  Casino.syncBalance(balance); updateStats(); startIdle();
}).catch(()=>{ balanceReady = true; startIdle(); });
</script>
