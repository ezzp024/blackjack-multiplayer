<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette — Obsidian Casino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="casino-core.js"></script>
<script>Casino.renderSidebar('roulette');Casino.requireAuth();</script>

<main class="casino-main">
<div class="game-page">

  <div class="stats-row">
    <div class="stat-box"><div class="sv" id="st-balance">$5,000</div><div class="sl">Balance</div></div>
    <div class="stat-box"><div class="sv" id="st-played">0</div><div class="sl">Rounds</div></div>
    <div class="stat-box"><div class="sv" id="st-lastnum" style="font-size:1.8rem">—</div><div class="sl">Last Number</div></div>
    <div class="stat-box"><div class="sv" id="st-net" style="color:var(--text2)">$0</div><div class="sl">Session P/L</div></div>
  </div>

  <div class="roulette-layout">
    <!-- WHEEL -->
    <div class="wheel-container">
      <div class="wheel-wrap">
        <div class="wheel-indicator"></div>
        <canvas id="rouletteCanvas" width="260" height="260"></canvas>
      </div>
      <div id="lastNumbers" class="last-numbers"></div>
      <div id="rouletteMsg" style="font-size:1rem;font-weight:800;text-align:center;min-height:28px;color:var(--text2)">Place bets to spin</div>
    </div>

    <!-- BETS SIDE -->
    <div>
      <div class="roulette-bets" id="rouletteTableWrap">
        <div style="font-size:0.7rem;font-weight:700;color:var(--text3);letter-spacing:2px;margin-bottom:10px">BETTING TABLE</div>
        <div class="roulette-table" id="rouletteTable"></div>
        <div class="placed-bets" id="placedBetsList"></div>
        <button class="clear-bets-btn" onclick="clearBets()" id="clearBetsBtn" style="display:none">Clear all bets</button>
      </div>

      <div class="bet-panel" style="margin-top:12px">
        <div class="bet-label">CHIP VALUE</div>
        <div class="bet-quick" style="margin-bottom:12px">
          <button onclick="setChip(5)" id="chip-5" class="active-chip">$5</button>
          <button onclick="setChip(10)" id="chip-10">$10</button>
          <button onclick="setChip(25)" id="chip-25">$25</button>
          <button onclick="setChip(100)" id="chip-100">$100</button>
          <button onclick="setChip(500)" id="chip-500">$500</button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-primary" onclick="spinWheel()" id="spinBtn">SPIN</button>
        </div>
      </div>
    </div>
  </div>

</div>
</main>

<script>
const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED_NUMS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const canvas = document.getElementById('rouletteCanvas');
const ctx = canvas.getContext('2d');
let wheelRotation = 0;
let spinning = false;
let pendingBets = [];
let chipValue = 5;
let lastNumbers = [];
let sessionNet = 0;
let roundsPlayed = 0;

// ── DRAW WHEEL ──
function drawWheel(rot) {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2, R = 124;
  const N = WHEEL_ORDER.length;
  const slotAngle = (2 * Math.PI) / N;
  ctx.clearRect(0, 0, W, H);

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, R + 6, 0, Math.PI * 2);
  ctx.fillStyle = '#c89b3c';
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);

  for (let i = 0; i < N; i++) {
    const num = WHEEL_ORDER[i];
    const start = i * slotAngle - Math.PI / 2;
    const end = start + slotAngle;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, start, end);
    ctx.closePath();
    ctx.fillStyle = num === 0 ? '#007a38' : RED_NUMS.has(num) ? '#8b1a1a' : '#0f0f0f';
    ctx.fill();
    ctx.strokeStyle = '#c89b3c';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Number text
    ctx.save();
    ctx.rotate(start + slotAngle / 2);
    ctx.translate(R * 0.74, 0);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px Inter,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(num, 0, 0);
    ctx.restore();
  }

  // Inner hub
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = '#c89b3c';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = '#0f1923';
  ctx.fill();

  // Spokes
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R * 0.13, Math.sin(a) * R * 0.13);
    ctx.lineTo(Math.cos(a) * R * 0.78, Math.sin(a) * R * 0.78);
    ctx.strokeStyle = 'rgba(200,155,60,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore();

  // Ball (shown as small circle at top inside wheel)
  if (!spinning) {
    ctx.beginPath();
    ctx.arc(cx, cy - R * 0.86, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.shadowColor = 'rgba(255,255,255,0.8)';
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

drawWheel(0);

// ── BUILD TABLE ──
function buildTable() {
  const table = document.getElementById('rouletteTable');
  // Zero row
  let html = `<div class="r-table-zero r-cell" onclick="addBet('straight',0)" style="margin-bottom:4px;background:#007a38">0</div>`;

  // Number grid: 12 columns, 3 rows (top=3n, mid=3n-1, bot=3n-2)
  html += '<div class="r-number-grid">';
  for (let col = 1; col <= 12; col++) {
    const top = col * 3;
    const mid = col * 3 - 1;
    const bot = col * 3 - 2;
    const colorTop = RED_NUMS.has(top) ? 'r-red' : 'r-black';
    const colorMid = RED_NUMS.has(mid) ? 'r-red' : 'r-black';
    const colorBot = RED_NUMS.has(bot) ? 'r-red' : 'r-black';
    html += `
      <div class="r-cell ${colorTop}" onclick="addBet('straight',${top})" data-num="${top}" id="nc${top}">${top}</div>
      <div class="r-cell ${colorMid}" onclick="addBet('straight',${mid})" data-num="${mid}" id="nc${mid}">${mid}</div>
      <div class="r-cell ${colorBot}" onclick="addBet('straight',${bot})" data-num="${bot}" id="nc${bot}">${bot}</div>`;
  }
  html += '</div>';

  // Column bets
  html += `<div class="r-number-grid" style="grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:4px">`;
  for (let c = 0; c < 12; c++) html += `<div class="r-outside-cell" onclick="addBet('colbet',${c})" style="font-size:0.6rem;padding:4px 0">2-1</div>`;
  html += '</div>';

  // Dozens
  html += `<div class="r-outside-row cols3" style="margin-bottom:3px">
    <div class="r-outside-cell" onclick="addBet('dozen',0)">1st 12</div>
    <div class="r-outside-cell" onclick="addBet('dozen',1)">2nd 12</div>
    <div class="r-outside-cell" onclick="addBet('dozen',2)">3rd 12</div>
  </div>`;

  // Outside row
  html += `<div class="r-outside-row cols6">
    <div class="r-outside-cell" onclick="addBet('range','low')">1–18</div>
    <div class="r-outside-cell" onclick="addBet('parity','even')">EVEN</div>
    <div class="r-outside-cell r-red" onclick="addBet('color','red')">RED</div>
    <div class="r-outside-cell r-black" onclick="addBet('color','black')">BLACK</div>
    <div class="r-outside-cell" onclick="addBet('parity','odd')">ODD</div>
    <div class="r-outside-cell" onclick="addBet('range','high')">19–36</div>
  </div>`;

  table.innerHTML = html;
}

buildTable();

function setChip(v) {
  chipValue = v;
  document.querySelectorAll('.bet-quick button').forEach(b => b.style.background = '');
  const el = document.getElementById('chip-' + v);
  if (el) el.style.background = 'rgba(0,199,77,0.2)';
}

setChip(5);

function addBet(type, value) {
  if (spinning) return;
  const existing = pendingBets.find(b => b.type === type && b.value == value);
  if (existing) existing.amount += chipValue;
  else pendingBets.push({ type, value, amount: chipValue });
  renderPendingBets();
}

function clearBets() {
  pendingBets = [];
  renderPendingBets();
}

function renderPendingBets() {
  const list = document.getElementById('placedBetsList');
  const btn = document.getElementById('clearBetsBtn');
  if (!pendingBets.length) { list.innerHTML = ''; btn.style.display = 'none'; return; }
  btn.style.display = 'block';
  const labels = {
    straight: n => `Straight #${n}`,
    dozen: n => ['1st 12','2nd 12','3rd 12'][n],
    range: v => v === 'low' ? '1–18' : '19–36',
    parity: v => v === 'even' ? 'Even' : 'Odd',
    color: v => v.charAt(0).toUpperCase() + v.slice(1),
    colbet: n => `Column ${n+1}`,
  };
  list.innerHTML = pendingBets.map(b =>
    `<div class="placed-bet-row"><span class="pb-label">${(labels[b.type] || (t => t))(b.value)}</span><span class="pb-amount">${Casino.fmt(b.amount)}</span></div>`
  ).join('');
}

function spinWheel() {
  if (spinning) return;
  if (!pendingBets.length) { setMsg('Place bets first!', false); return; }
  const totalBet = pendingBets.reduce((s, b) => s + b.amount, 0);
  if (totalBet > Casino.getBalance()) { setMsg('Insufficient balance', false); return; }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const resultNum = WHEEL_ORDER[Math.floor(Math.random() * WHEEL_ORDER.length)];
  const targetIdx = WHEEL_ORDER.indexOf(resultNum);
  const slotAngle = (2 * Math.PI) / 37;
  const targetAngleInWheel = targetIdx * slotAngle + slotAngle / 2;
  const spins = 5 + Math.floor(Math.random() * 3);
  const toAdd = (Math.PI * 2 * spins) + (Math.PI * 2 - targetAngleInWheel) - (wheelRotation % (Math.PI * 2));
  const finalRot = wheelRotation + toAdd;
  const duration = 4000;
  const start = performance.now();
  const startRot = wheelRotation;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = Math.min(now - start, duration);
    const progress = elapsed / duration;
    wheelRotation = startRot + (finalRot - startRot) * easeOut(progress);
    drawWheel(wheelRotation);
    if (elapsed < duration) requestAnimationFrame(animate);
    else {
      wheelRotation = finalRot;
      drawWheel(wheelRotation);
      onSpinComplete(resultNum, totalBet);
    }
  }

  requestAnimationFrame(animate);
}

function onSpinComplete(num, totalBet) {
  lastNumbers.unshift(num);
  if (lastNumbers.length > 10) lastNumbers.pop();
  renderLastNumbers();

  let totalReturn = 0;
  const color = num === 0 ? 'green' : RED_NUMS.has(num) ? 'red' : 'black';

  for (const bet of pendingBets) {
    let payout = 0;
    if (bet.type === 'straight' && bet.value == num) payout = bet.amount * 36;
    else if (bet.type === 'color' && bet.value === color) payout = bet.amount * 2;
    else if (bet.type === 'parity') {
      if (num !== 0 && ((bet.value === 'even' && num % 2 === 0) || (bet.value === 'odd' && num % 2 === 1))) payout = bet.amount * 2;
    } else if (bet.type === 'range') {
      if ((bet.value === 'low' && num >= 1 && num <= 18) || (bet.value === 'high' && num >= 19 && num <= 36)) payout = bet.amount * 2;
    } else if (bet.type === 'dozen') {
      const doz = bet.value;
      if ((doz === 0 && num >= 1 && num <= 12) || (doz === 1 && num >= 13 && num <= 24) || (doz === 2 && num >= 25 && num <= 36)) payout = bet.amount * 3;
    } else if (bet.type === 'colbet') {
      // Column: col 0 = 3,6,9..36 (n%3===0), col 1 = 2,5,8..35 (n%3===2), col 2 = 1,4,7..34 (n%3===1)
      const colMap = [0, 2, 1]; // which column each maps to
      if (num !== 0 && (num % 3) === [0, 2, 1][bet.value]) payout = bet.amount * 3;
    }
    totalReturn += payout;
  }

  const newBal = Casino.recordBet('roulette', totalBet, totalReturn);
  roundsPlayed++;
  sessionNet += totalReturn - totalBet;
  const won = totalReturn > 0;
  const colorClass = num === 0 ? 'green' : RED_NUMS.has(num) ? 'red' : 'black';
  const numDisplay = `<span class="last-num ${colorClass}" style="display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem">${num}</span>`;

  if (totalReturn > totalBet) setMsg(`${numDisplay} WIN +${Casino.fmt(totalReturn - totalBet)}`, true);
  else if (totalReturn === totalBet) setMsg(`${numDisplay} PUSH`, null);
  else setMsg(`${numDisplay} LOST ${Casino.fmt(totalBet)}`, false);

  document.getElementById('st-balance').textContent = Casino.fmt(newBal);
  document.getElementById('st-played').textContent = roundsPlayed;
  document.getElementById('st-lastnum').textContent = num;
  document.getElementById('st-lastnum').style.color = colorClass === 'red' ? 'var(--red)' : colorClass === 'green' ? 'var(--green)' : 'var(--text)';
  document.getElementById('st-net').textContent = Casino.fmt(sessionNet);
  document.getElementById('st-net').style.color = sessionNet >= 0 ? 'var(--green)' : 'var(--red)';

  pendingBets = [];
  renderPendingBets();
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
  Casino.updateBalance();
}

function setMsg(html, won) {
  const el = document.getElementById('rouletteMsg');
  el.innerHTML = html;
  el.style.color = won === true ? 'var(--green)' : won === false ? 'var(--red)' : 'var(--gold2)';
}

function renderLastNumbers() {
  document.getElementById('lastNumbers').innerHTML = lastNumbers.map(n => {
    const c = n === 0 ? 'green' : RED_NUMS.has(n) ? 'red' : 'black';
    return `<div class="last-num ${c}">${n}</div>`;
  }).join('');
}

// Init
const p = Casino.getProfile();
document.getElementById('st-balance').textContent = Casino.fmt(p.balance);
document.getElementById('st-played').textContent = p.stats.roulette.played;
</script>
</body>
</html>
