<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharaoh's Fortune — Obsidian Casino</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .egypt-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,#1a0e00 0%,#0a0600 50%,#050300 100%);overflow:hidden}
    .egypt-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(240,180,30,0.06) 0%,transparent 60%)}
    .stars{position:absolute;inset:0}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite alternate}
    @keyframes twinkle{0%{opacity:0.2}100%{opacity:0.8}}
    .sand-dunes{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent 0%,rgba(180,120,20,0.04) 60%,rgba(100,70,10,0.08) 100%)}
    .pyramid-l,.pyramid-r{position:absolute;bottom:0;border-style:solid;border-color:transparent transparent rgba(180,120,20,0.08) transparent;opacity:0.5}
    .pyramid-l{left:-5%;border-width:0 80px 140px 80px}
    .pyramid-r{right:0%;border-width:0 70px 120px 70px}

    .egypt-wrap{max-width:680px;margin:0 auto;padding:24px 16px}
    .eg-header{text-align:center;margin-bottom:24px}
    .eg-logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px}
    .eg-logo-icon{width:52px;height:52px;background:rgba(240,180,30,0.1);border:1px solid rgba(240,180,30,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center}
    .eg-title{font-size:1.6rem;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#f0d060,#d4a020,#a06010);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .eg-subtitle{font-size:0.7rem;color:#5a4010;letter-spacing:4px;text-transform:uppercase;font-weight:700}

    .slot-machine-frame{background:linear-gradient(180deg,#0e0800,#080500);border:2px solid rgba(240,180,30,0.2);border-radius:20px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
    .slot-machine-frame::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(240,180,30,0.04) 0%,transparent 40%)}
    .corner{position:absolute;width:30px;height:30px}
    .corner-tl{top:8px;left:8px;border-top:2px solid rgba(240,180,30,0.5);border-left:2px solid rgba(240,180,30,0.5)}
    .corner-tr{top:8px;right:8px;border-top:2px solid rgba(240,180,30,0.5);border-right:2px solid rgba(240,180,30,0.5)}
    .corner-bl{bottom:8px;left:8px;border-bottom:2px solid rgba(240,180,30,0.5);border-left:2px solid rgba(240,180,30,0.5)}
    .corner-br{bottom:8px;right:8px;border-bottom:2px solid rgba(240,180,30,0.5);border-right:2px solid rgba(240,180,30,0.5)}

    .reels-outer{background:#060300;border:1px solid rgba(240,180,30,0.25);border-radius:12px;padding:10px;margin-bottom:14px;position:relative}
    .payline{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:2px;background:linear-gradient(90deg,transparent,rgba(240,180,30,0.5),rgba(255,220,60,0.9),rgba(240,180,30,0.5),transparent);pointer-events:none;z-index:5}
    .payline-end{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:14px;border:2px solid rgba(255,220,60,0.6);border-radius:50%;background:rgba(255,220,60,0.1)}
    .payline-end-left{left:4px}
    .payline-end-right{right:4px}
    .reels-row{display:flex;gap:6px;justify-content:center}
    .reel-col{flex:1;max-width:160px;height:200px;overflow:hidden;border-radius:8px;background:#040200;border:1px solid rgba(255,255,255,0.04)}
    .reel-strip{display:flex;flex-direction:column;transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94)}
    .symbol-cell{height:200px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .symbol-cell svg{width:80%;height:80%;max-width:120px;max-height:120px}
    .reel-col.winner{box-shadow:0 0 20px rgba(240,180,30,0.6),inset 0 0 15px rgba(240,180,30,0.1);border-color:rgba(240,180,30,0.5);animation:reelGlow 0.4s ease 3}
    @keyframes reelGlow{0%,100%{box-shadow:0 0 10px rgba(240,180,30,0.3)}50%{box-shadow:0 0 30px rgba(240,180,30,0.8),inset 0 0 20px rgba(240,180,30,0.2)}}

    .slot-msg{text-align:center;font-size:1rem;font-weight:900;letter-spacing:2px;min-height:32px;padding:6px 0}
    .paytable-row{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.75rem}
    .paytable-row:last-child{border-bottom:none}
    .paytable-row .sym-name{color:#8ea3b1;font-weight:600}
    .paytable-row .sym-payout{color:#f0c040;font-weight:800}

    .controls-card{background:#0e0800;border:1px solid rgba(240,180,30,0.2);border-radius:16px;padding:18px}
    .ctrl-label{font-size:0.62rem;font-weight:800;color:#4a3010;text-transform:uppercase;letter-spacing:2px;margin-bottom:7px}
    .bet-input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .bet-inp{flex:1;background:#080500;border:1px solid rgba(240,180,30,0.2);border-radius:8px;color:#fff;font-size:1rem;font-weight:700;padding:10px 12px;outline:none;font-family:inherit}
    .bet-inp:focus{border-color:rgba(240,180,30,0.5)}
    .bet-adj{background:#160c00;border:1px solid rgba(200,140,20,0.2);color:#8ea3b1;border-radius:6px;padding:8px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .bet-adj:hover{background:#201000;color:#f0c040}
    .bet-presets{display:flex;gap:6px;margin-bottom:14px}
    .bet-presets button{flex:1;background:#080500;border:1px solid rgba(200,140,20,0.15);color:#4a3010;border-radius:6px;padding:6px 0;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s}
    .bet-presets button:hover{background:#120800;color:#f0c040;border-color:rgba(240,180,30,0.3)}
    .spin-btn{width:100%;padding:15px;background:linear-gradient(135deg,#b87000,#d4a020,#e8c030);border:none;border-radius:12px;color:#1a0a00;font-size:1rem;font-weight:900;cursor:pointer;letter-spacing:2px;transition:all 0.15s;text-transform:uppercase;position:relative;overflow:hidden;border-top:1px solid rgba(255,230,100,0.4)}
    .spin-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 50%);pointer-events:none}
    .spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(200,140,20,0.5)}
    .spin-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .stat-card-mini{background:#0e0800;border:1px solid rgba(240,180,30,0.12);border-radius:10px;padding:10px;text-align:center}
    .stat-card-mini .sv{font-size:1rem;font-weight:800;color:#fff}
    .stat-card-mini .sl{font-size:0.6rem;color:#4a3010;text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}

    .jackpot-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:5rem;font-weight:900;color:rgba(240,180,30,0.95);z-index:9999;pointer-events:none;animation:jackpotPop 1s ease forwards;text-shadow:0 0 80px rgba(240,140,0,0.9),0 0 40px rgba(255,200,50,0.7);letter-spacing:6px;text-transform:uppercase;white-space:nowrap}
    @keyframes jackpotPop{0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}35%{transform:translate(-50%,-50%) scale(1.15);opacity:1}65%{transform:translate(-50%,-50%) scale(0.97)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

</head>

let spinning = false, balance = 0, spins = 0, wins = 0, bestWin = 0;

function weightedRandom() {
  const total = SYMBOLS.reduce((s,sym) => s + sym.weight, 0);
  let r = Math.random() * total;
  for (const sym of SYMBOLS) { r -= sym.weight; if (r <= 0) return sym; }
  return SYMBOLS[SYMBOLS.length - 1];
}

function buildStrip(stripEl, targetSym) {
  stripEl.innerHTML = '';
  for (let i = 0; i < 24; i++) {
    const cell = document.createElement('div');
    cell.className = 'symbol-cell';
    cell.innerHTML = weightedRandom().svg;
    stripEl.appendChild(cell);
  }
  const finalCell = document.createElement('div');
  finalCell.className = 'symbol-cell';
  finalCell.innerHTML = targetSym.svg;
  stripEl.appendChild(finalCell);
}

function initStrips() {
  for (let i = 0; i < 3; i++) {
    const strip = document.getElementById('strip' + i);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    buildStrip(strip, weightedRandom());
    const total = strip.children.length;
    strip.style.transform = `translateY(-${(total - 1) * 200}px)`;
  }
}

async function spin() {
  if (spinning) return;
  const bet = Math.max(1, parseFloat(document.getElementById('betAmt').value) || 10);
  if (bet > balance) return;

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('slotMsg').textContent = '';
  [0,1,2].forEach(i => document.getElementById('reel' + i).classList.remove('winner'));

  const targets = [weightedRandom(), weightedRandom(), weightedRandom()];
  const isWin = targets[0].id === targets[1].id && targets[1].id === targets[2].id;
  const winSym = isWin ? targets[0] : null;
  const multiplier = isWin ? winSym.p3 : 0;
  const returned = isWin ? Math.round(bet * multiplier * 100) / 100 : 0;

  const promises = targets.map((target, i) => new Promise(resolve => {
    const strip = document.getElementById('strip' + i);
    buildStrip(strip, target);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;
    const total = strip.children.length;
    setTimeout(() => {
      strip.style.transition = `transform ${0.8 + i * 0.2}s cubic-bezier(0.25,0.46,0.45,0.94)`;
      strip.style.transform = `translateY(-${(total - 1) * 200}px)`;
      setTimeout(resolve, (0.8 + i * 0.2) * 1000 + 100);
    }, i * 100);
  }));

  await Promise.all(promises);

  spins++;
  if (isWin) {
    wins++;
    if (returned > bestWin) bestWin = returned;
    [0,1,2].forEach(i => document.getElementById('reel' + i).classList.add('winner'));
    document.getElementById('slotMsg').style.color = '#f0c040';
    document.getElementById('slotMsg').textContent = `${winSym.label} × ${multiplier} → +$${returned.toFixed(2)}`;
    const k = document.createElement('div');
    k.className = 'jackpot-flash';
    k.textContent = multiplier >= 100 ? '⚡ JACKPOT ⚡' : multiplier >= 30 ? 'BIG WIN!' : 'WIN!';
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 1000);
    document.getElementById('st-best').textContent = '$' + bestWin.toFixed(2);
  } else {
    document.getElementById('slotMsg').style.color = '#5a4010';
    document.getElementById('slotMsg').textContent = '— The sands are silent —';
  }

  try {
    const r = await fetch('/api/bet', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ game:'slots', wagered:bet, returned }) });
    if (r.ok) { const d = await r.json(); balance = d.balance; Casino.syncBalance(balance); }
  } catch {}

  Casino.showToast(returned - bet);
  document.getElementById('st-balance').textContent = '$' + balance.toFixed(2);
  document.getElementById('st-spins').textContent = spins;
  document.getElementById('st-wins').textContent = wins;
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
  initStrips();
}

function adjBet(f) {
  const el = document.getElementById('betAmt');
  el.value = Math.max(1, Math.min(Math.round(parseFloat(el.value || 1) * f), balance));
}
function sb(v) { document.getElementById('betAmt').value = Math.min(v, balance); }

function buildPaytable() {
  const pt = document.getElementById('paytable');
  SYMBOLS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'paytable-row';
    row.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px">${s.svg}</div><span class="sym-name">${s.label}</span></div><span class="sym-payout">${s.p3}×</span>`;
    pt.appendChild(row);
  });
}

// Stars
(function() {
  const sf = document.getElementById('starField');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*70}%;width:${size}px;height:${size}px;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    sf.appendChild(s);
  }
})();

fetch('/api/me').then(r=>r.json()).then(d=>{ balance=d.balance; Casino.syncBalance(balance); document.getElementById('st-balance').textContent='$'+balance.toFixed(2); document.getElementById('spinBtn').disabled=false; }).catch(()=>{ document.getElementById('spinBtn').disabled=false; });
buildPaytable();
initStrips();
</script>
</body>
</html>
