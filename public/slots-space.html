    .space-wrap{max-width:680px;margin:0 auto;padding:24px 16px}

    .slot-machine-frame{background:linear-gradient(180deg,#060018,#020010);border:2px solid rgba(80,60,200,0.2);border-radius:20px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}

    .corner-tr{top:8px;right:8px;border-top:2px solid rgba(100,80,255,0.4);border-right:2px solid rgba(100,80,255,0.4)}
    .corner-bl{bottom:8px;left:8px;border-bottom:2px solid rgba(100,80,255,0.4);border-left:2px solid rgba(100,80,255,0.4)}

    .payline{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:2px;background:linear-gradient(90deg,transparent,rgba(80,60,255,0.5),rgba(120,100,255,0.9),rgba(80,60,255,0.5),transparent);pointer-events:none;z-index:5}
    .payline-end{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:14px;border:2px solid rgba(120,100,255,0.6);border-radius:50%;background:rgba(100,80,255,0.1)}
    .payline-end-left{left:4px}
    .payline-end-right{right:4px}
    .reels-row{display:flex;gap:6px;justify-content:center}
    .reel-col{flex:1;max-width:160px;height:200px;overflow:hidden;border-radius:8px;background:#020008;border:1px solid rgba(255,255,255,0.04)}
    .reel-strip{display:flex;flex-direction:column;transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94)}
    .symbol-cell{height:200px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .symbol-cell svg{width:80%;height:80%;max-width:120px;max-height:120px}
    .reel-col.winner{box-shadow:0 0 20px rgba(100,80,255,0.7),inset 0 0 15px rgba(100,80,255,0.15);border-color:rgba(100,80,255,0.6);animation:reelGlow 0.4s ease 3}

    .bet-presets button:hover{background:#0a0828;color:#a080ff;border-color:rgba(100,80,255,0.3)}
    .spin-btn{width:100%;padding:15px;background:linear-gradient(135deg,#3020a0,#6040d0,#8060ff);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:900;cursor:pointer;letter-spacing:2px;transition:all 0.15s;text-transform:uppercase;position:relative;overflow:hidden;border-top:1px solid rgba(180,160,255,0.3)}

    .spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(80,60,200,0.5)}
    .spin-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .stat-card-mini{background:#060018;border:1px solid rgba(80,60,200,0.12);border-radius:10px;padding:10px;text-align:center}

let spinning = false, balance = 0, spins = 0, wins = 0, bestWin = 0;

function weightedRandom() {
  const total = SYMBOLS.reduce((s,sym) => s + sym.weight, 0);
  let r = Math.random() * total;
  for (const sym of SYMBOLS) { r -= sym.weight; if (r <= 0) return sym; }
  return SYMBOLS[SYMBOLS.length - 1];
}

function buildStrip(stripEl, targetSym) {
  stripEl.innerHTML = '';
  for (let i = 0; i < 24; i++) {
    const cell = document.createElement('div');
    cell.className = 'symbol-cell';
    cell.innerHTML = weightedRandom().svg;
    stripEl.appendChild(cell);
  }
  const finalCell = document.createElement('div');
  finalCell.className = 'symbol-cell';
  finalCell.innerHTML = targetSym.svg;
  stripEl.appendChild(finalCell);
}

function initStrips() {
  for (let i = 0; i < 3; i++) {
    const strip = document.getElementById('strip' + i);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    buildStrip(strip, weightedRandom());
    const total = strip.children.length;
    strip.style.transform = `translateY(-${(total - 1) * 200}px)`;
  }
}

async function spin() {
  if (spinning) return;
  const bet = Math.max(1, parseFloat(document.getElementById('betAmt').value) || 10);
  if (bet > balance) return;

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('slotMsg').textContent = '';
  [0,1,2].forEach(i => document.getElementById('reel' + i).classList.remove('winner'));

  const targets = [weightedRandom(), weightedRandom(), weightedRandom()];
  const isWin = targets[0].id === targets[1].id && targets[1].id === targets[2].id;
  const winSym = isWin ? targets[0] : null;
  const multiplier = isWin ? winSym.p3 : 0;
  const returned = isWin ? Math.round(bet * multiplier * 100) / 100 : 0;

  const promises = targets.map((target, i) => new Promise(resolve => {
    const strip = document.getElementById('strip' + i);
    buildStrip(strip, target);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;
    const total = strip.children.length;
    setTimeout(() => {
      strip.style.transition = `transform ${0.8 + i * 0.2}s cubic-bezier(0.25,0.46,0.45,0.94)`;
      strip.style.transform = `translateY(-${(total - 1) * 200}px)`;
      setTimeout(resolve, (0.8 + i * 0.2) * 1000 + 100);
    }, i * 100);
  }));

  await Promise.all(promises);

  spins++;
  if (isWin) {
    wins++;
    if (returned > bestWin) bestWin = returned;
    [0,1,2].forEach(i => document.getElementById('reel' + i).classList.add('winner'));
    const winColor = winSym.color;
    document.getElementById('slotMsg').style.color = winColor;
    document.getElementById('slotMsg').textContent = `${winSym.label} × ${multiplier} → +$${returned.toFixed(2)}`;
    const k = document.createElement('div');
    k.className = 'win-blast';
    k.style.cssText = `color:${winColor};text-shadow:0 0 40px ${winColor}`;
    k.textContent = multiplier >= 100 ? '🚀 COSMIC WIN!' : multiplier >= 40 ? 'WARP SPEED!' : 'WIN!';
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 1000);
    document.getElementById('st-best').textContent = '$' + bestWin.toFixed(2);
  } else {
    document.getElementById('slotMsg').style.color = '#2a2060';
    document.getElementById('slotMsg').textContent = '— Lost in space —';
  }

  try {
    const r = await fetch('/api/bet', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ game:'slots', wagered:bet, returned }) });
    if (r.ok) { const d = await r.json(); balance = d.balance; Casino.syncBalance(balance); }
  } catch {}

  Casino.showToast(returned - bet);
  document.getElementById('st-balance').textContent = '$' + balance.toFixed(2);
  document.getElementById('st-spins').textContent = spins;
  document.getElementById('st-wins').textContent = wins;
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
  initStrips();
}

function adjBet(f) {
  const el = document.getElementById('betAmt');
  el.value = Math.max(1, Math.min(Math.round(parseFloat(el.value || 1) * f), balance));
}
function sb(v) { document.getElementById('betAmt').value = Math.min(v, balance); }

function buildPaytable() {
  const pt = document.getElementById('paytable');
  SYMBOLS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'paytable-row';
    row.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px">${s.svg}</div><span class="sym-name">${s.label}</span></div><span class="sym-payout">${s.p3}×</span>`;
    pt.appendChild(row);
  });
}

// Stars
(function() {
  const sf = document.getElementById('starField');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.3;
    const opacity = Math.random() * 0.6 + 0.2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;opacity:${opacity}`;
    if (Math.random() > 0.7) {
      s.style.animation = `twinkle ${2+Math.random()*4}s linear infinite alternate`;
      s.style.animationDelay = Math.random()*4 + 's';
    }
    sf.appendChild(s);
  }
  // Shooting stars
  for (let i = 0; i < 3; i++) {
    const ss = document.createElement('div');
    ss.className = 'shooting-star';
    ss.style.cssText = `left:${Math.random()*60}%;top:${Math.random()*40}%;width:${60+Math.random()*80}px;animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*6}s`;
    sf.appendChild(ss);
  }
})();

fetch('/api/me').then(r=>r.json()).then(d=>{ balance=d.balance; Casino.syncBalance(balance); document.getElementById('st-balance').textContent='$'+balance.toFixed(2); document.getElementById('spinBtn').disabled=false; }).catch(()=>{ document.getElementById('spinBtn').disabled=false; });
buildPaytable();
initStrips();
</script>
</body>
</html>
