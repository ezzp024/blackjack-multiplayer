    .corner-tl{top:8px;left:8px;border-top:2px solid rgba(220,160,50,0.4);border-left:2px solid rgba(220,160,50,0.4)}
    .corner-tr{top:8px;right:8px;border-top:2px solid rgba(220,160,50,0.4);border-right:2px solid rgba(220,160,50,0.4)}
    .corner-bl{bottom:8px;left:8px;border-bottom:2px solid rgba(220,160,50,0.4);border-left:2px solid rgba(220,160,50,0.4)}
    .corner-br{bottom:8px;right:8px;border-bottom:2px solid rgba(220,160,50,0.4);border-right:2px solid rgba(220,160,50,0.4)}

    .payline-end{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:14px;border:2px solid rgba(255,220,80,0.6);border-radius:50%;background:rgba(255,220,80,0.1)}

    .payline-end-right{right:4px}
    .reels-row{display:flex;gap:6px;justify-content:center}

    .reel-col.winner{box-shadow:0 0 20px rgba(255,220,80,0.6),inset 0 0 15px rgba(255,220,80,0.1);border-color:rgba(255,220,80,0.5);animation:reelGlow 0.4s ease 3}

    .slot-msg{text-align:center;font-size:1rem;font-weight:900;letter-spacing:2px;min-height:32px;padding:6px 0}

    .bet-inp{flex:1;background:#060310;border:1px solid rgba(180,130,50,0.2);border-radius:8px;color:#fff;font-size:1rem;font-weight:700;padding:10px 12px;outline:none;font-family:inherit}

    .bet-adj{background:#160a08;border:1px solid rgba(180,100,30,0.2);color:#8ea3b1;border-radius:6px;padding:8px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 0.15s}

    .bet-presets{display:flex;gap:6px;margin-bottom:14px}

    .bet-presets button:hover{background:#120807;color:#f0c040;border-color:rgba(220,160,50,0.3)}
    .spin-btn{width:100%;padding:15px;background:linear-gradient(135deg,#b8000a,#dc143c,#ff2040);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:900;cursor:pointer;letter-spacing:2px;transition:all 0.15s;text-transform:uppercase;position:relative;overflow:hidden;border-top:1px solid rgba(255,120,120,0.3)}
    .spin-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,transparent 50%);pointer-events:none}
    .spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(220,20,60,0.5)}

    .stat-card-mini{background:#0a0510;border:1px solid rgba(180,130,50,0.12);border-radius:10px;padding:10px;text-align:center}

      <path d="M28 57 Q40 66 52 57" fill="none" stroke="#e0e0ff" stroke-width="2"/>
      <!-- Teeth -->
      <path d="M34 57 L32 63 L36 60 L38 65 L40 57" fill="rgba(255,255,255,0.8)"/>
      <path d="M46 57 L48 63 L44 60 L42 65 L40 57" fill="rgba(255,255,255,0.8)"/>
    </svg>`
  },
  {
    id: 'mon', label: 'Family Crest', color: '#f0c040', weight: 10, p3: 5,
    svg: `<svg viewBox="0 0 80 80" fill="none">
      <defs><linearGradient id="mong" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0d060"/><stop offset="1" stop-color="#c08020"/></linearGradient></defs>
      <circle cx="40" cy="40" r="32" fill="#1a0e00" stroke="url(#mong)" stroke-width="2"/>
      <circle cx="40" cy="40" r="27" fill="none" stroke="rgba(240,192,64,0.3)" stroke-width="0.5"/>
      <!-- Three leaves (mitsu tomoe style) -->
      <path d="M40 20 Q50 28 44 38 Q52 34 56 28 Q56 18 44 20Z" fill="url(#mong)"/>
      <path d="M40 20 Q30 28 36 38 Q28 34 24 28 Q24 18 36 20Z" fill="url(#mong)"/>
      <path d="M44 38 Q36 38 36 46 Q36 56 40 56 Q50 52 48 42Z" fill="url(#mong)"/>
      <circle cx="40" cy="40" r="7" fill="#1a0e00" stroke="url(#mong)" stroke-width="1"/>
      <circle cx="40" cy="40" r="3" fill="url(#mong)"/>
    </svg>`
  },
];

let spinning = false, balance = 0, spins = 0, wins = 0, bestWin = 0;

function weightedRandom() {
  const total = SYMBOLS.reduce((s, sym) => s + sym.weight, 0);
  let r = Math.random() * total;
  for (const sym of SYMBOLS) { r -= sym.weight; if (r <= 0) return sym; }
  return SYMBOLS[SYMBOLS.length - 1];
}

function buildStrip(stripEl, targetSym) {
  stripEl.innerHTML = '';
  const extras = 24;
  for (let i = 0; i < extras; i++) {
    const cell = document.createElement('div');
    cell.className = 'symbol-cell';
    cell.innerHTML = weightedRandom().svg;
    stripEl.appendChild(cell);
  }
  // Final (visible) cell
  const finalCell = document.createElement('div');
  finalCell.className = 'symbol-cell';
  finalCell.innerHTML = targetSym.svg;
  stripEl.appendChild(finalCell);
}

function initStrips() {
  for (let i = 0; i < 3; i++) {
    const strip = document.getElementById('strip' + i);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    const target = weightedRandom();
    buildStrip(strip, target);
    // Position so last cell is visible
    const cellH = 200;
    const total = strip.children.length;
    strip.style.transform = `translateY(-${(total - 1) * cellH}px)`;
  }
}

async function spin() {
  if (spinning) return;
  const bet = Math.max(1, parseFloat(document.getElementById('betAmt').value) || 10);
  if (bet > balance) return;

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('slotMsg').textContent = '';
  document.getElementById('slotMsg').style.color = '#8ea3b1';

  // Remove winner classes
  [0,1,2].forEach(i => document.getElementById('reel' + i).classList.remove('winner'));

  const targets = [weightedRandom(), weightedRandom(), weightedRandom()];

  // Check win
  const allSame = targets[0].id === targets[1].id && targets[1].id === targets[2].id;
  const allWild = targets.some(t => t.id === 'wild');
  const effectiveIds = targets.map(t => t.id === 'wild' ? targets.find(s => s.id !== 'wild')?.id || t.id : t.id);
  const isWin = allSame || (targets.filter(t => t.id === 'wild').length >= 1 && effectiveIds[0] === effectiveIds[1] && effectiveIds[1] === effectiveIds[2]);
  const winSymbol = isWin ? SYMBOLS.find(s => s.id === targets.find(t => t.id !== 'wild')?.id || targets[0].id) || targets[0] : null;
  const multiplier = isWin ? winSymbol.p3 : 0;
  const returned = isWin ? Math.round(bet * multiplier * 100) / 100 : 0;

  // Animate reels
  const cellH = 200;
  const promises = targets.map((target, i) => new Promise(resolve => {
    const strip = document.getElementById('strip' + i);
    buildStrip(strip, target);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;
    const total = strip.children.length;
    const delay = i * 120;
    setTimeout(() => {
      strip.style.transition = `transform ${0.8 + i * 0.15}s cubic-bezier(0.25,0.46,0.45,0.94)`;
      strip.style.transform = `translateY(-${(total - 1) * cellH}px)`;
      setTimeout(resolve, (0.8 + i * 0.15) * 1000 + 100);
    }, delay);
  }));

  await Promise.all(promises);

  // Results
  spins++;
  if (isWin) {
    wins++;
    if (returned > bestWin) bestWin = returned;
    [0,1,2].forEach(i => document.getElementById('reel' + i).classList.add('winner'));
    document.getElementById('slotMsg').style.color = '#f0c040';
    document.getElementById('slotMsg').textContent = `${winSymbol.label} Ã— ${multiplier} â†’ +$${returned.toFixed(2)}`;
    // Flash kanji
    const k = document.createElement('div');
    k.className = 'kanji-win';
    k.textContent = multiplier >= 50 ? 'å¤§å‹' : 'å‹';
    document.body.appendChild(k);
    setTimeout(() => k.remove(), 900);
    document.getElementById('st-best').textContent = '$' + bestWin.toFixed(2);
  } else {
    document.getElementById('slotMsg').style.color = '#4a6375';
    document.getElementById('slotMsg').textContent = '— No match, try again —';
  }

  // Update balance
  try {
    const r = await fetch('/api/bet', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ game:'slots', wagered:bet, returned }) });
    if (r.ok) { const d = await r.json(); balance = d.balance; Casino.syncBalance(balance); }
  } catch {}

  document.getElementById('st-balance').textContent = '$' + balance.toFixed(2);
  document.getElementById('st-spins').textContent = spins;
  document.getElementById('st-wins').textContent = wins;

  spinning = false;
  document.getElementById('spinBtn').disabled = false;
  initStrips();
}

function adjBet(f) {
  const el = document.getElementById('betAmt');
  el.value = Math.max(1, Math.min(Math.round(parseFloat(el.value || 1) * f), balance));
}
function sb(v) { document.getElementById('betAmt').value = Math.min(v, balance); }

// Paytable
function buildPaytable() {
  const pt = document.getElementById('paytable');
  SYMBOLS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'paytable-row';
    row.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px">${s.svg}</div><span class="sym-name">${s.label}</span></div><span class="sym-payout">${s.p3}Ã—</span>`;
    pt.appendChild(row);
  });
}

// Sakura particles
function spawnSakura() {
  const bg = document.querySelector('.samurai-bg');
  if (!bg) return;
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'sakura';
    const left = Math.random() * 100;
    const delay = Math.random() * 10;
    const dur = 8 + Math.random() * 8;
    const sx = (Math.random() - 0.5) * 200;
    s.style.cssText = `left:${left}%;top:-20px;width:8px;height:8px;background:rgba(255,180,190,0.7);border-radius:50% 0;animation-delay:${delay}s;animation-duration:${dur}s;--sx:${sx}px`;
    bg.appendChild(s);
  }
}

// Init
fetch('/api/me').then(r=>r.json()).then(d=>{ balance=d.balance; Casino.syncBalance(balance); document.getElementById('st-balance').textContent='$'+balance.toFixed(2); document.getElementById('spinBtn').disabled=false; }).catch(()=>{ document.getElementById('spinBtn').disabled=false; });
buildPaytable();
initStrips();
spawnSakura();
</script>
