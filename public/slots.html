<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slots — Obsidian Casino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="casino-core.js"></script>
<script>Casino.renderSidebar('slots');</script>

<main class="casino-main">
<div class="game-page">

  <div class="stats-row" id="slotsStats">
    <div class="stat-box"><div class="sv" id="st-balance">$5,000</div><div class="sl">Balance</div></div>
    <div class="stat-box"><div class="sv" id="st-played">0</div><div class="sl">Spins</div></div>
    <div class="stat-box"><div class="sv" id="st-won">0</div><div class="sl">Wins</div></div>
    <div class="stat-box"><div class="sv" id="st-bigwin">—</div><div class="sl">Best Win</div></div>
  </div>

  <div class="slot-machine">
    <div class="slot-title">OBSIDIAN SLOTS</div>
    <div class="reels-frame">
      <div class="payline-marker"></div>
      <div class="reels-container">
        <div class="reel" id="reel0"><div class="reel-strip" id="strip0"></div></div>
        <div class="reel" id="reel1"><div class="reel-strip" id="strip1"></div></div>
        <div class="reel" id="reel2"><div class="reel-strip" id="strip2"></div></div>
      </div>
    </div>
    <div class="slot-result-msg" id="slotMsg">—</div>
  </div>

  <div class="bet-panel">
    <div class="bet-label">BET AMOUNT</div>
    <div class="bet-panel-row">
      <div class="bet-input-wrap">
        <div class="bet-currency">$</div>
        <input type="number" id="betAmt" value="10" min="1" step="1">
      </div>
      <button class="bet-half" onclick="adjustBet(0.5)">½</button>
      <button class="bet-double" onclick="adjustBet(2)">×2</button>
    </div>
    <div class="bet-quick">
      <button onclick="setBetAmt(5)">$5</button>
      <button onclick="setBetAmt(10)">$10</button>
      <button onclick="setBetAmt(25)">$25</button>
      <button onclick="setBetAmt(50)">$50</button>
      <button onclick="setBetAmt(100)">$100</button>
    </div>
    <div style="margin-top:14px">
      <button class="btn-primary" id="spinBtn" onclick="spin()">SPIN</button>
    </div>
  </div>

  <div style="margin-top:16px">
    <div class="section-title">PAYTABLE</div>
    <div class="paytable-grid" id="paytableGrid"></div>
  </div>

</div>
</main>

<script>
const SYMS = Casino.SLOT_SYMBOLS;
const CELL_H = 80;
let spinning = false;
let bestWin = 0;
let spinsPlayed = 0, winsCount = 0;

function weightedRandom() {
  const total = SYMS.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const s of SYMS) { r -= s.weight; if (r <= 0) return s; }
  return SYMS[SYMS.length - 1];
}

function buildStrips() {
  for (let r = 0; r < 3; r++) {
    const strip = document.getElementById('strip' + r);
    const items = [];
    for (let i = 0; i < 40; i++) items.push(SYMS[Math.floor(Math.random() * SYMS.length)]);
    strip.innerHTML = items.map(s =>
      `<div class="reel-cell"><div style="width:56px;height:56px">${s.svg}</div></div>`
    ).join('');
    strip.style.transform = 'translateY(0)';
  }
}

function buildPaytable() {
  const grid = document.getElementById('paytableGrid');
  grid.innerHTML = [...SYMS].reverse().map(s =>
    `<div class="paytable-row">
      <div>${s.svg}</div>
      <span class="pt-label">${s.label} ×3</span>
      <span class="pt-mult">${s.p3}×</span>
    </div>`
  ).join('');
}

function getResult() {
  return [weightedRandom(), weightedRandom(), weightedRandom()];
}

function calcWin(result, bet) {
  const [a, b, c] = result;
  if (a.id === b.id && b.id === c.id) return bet * a.p3;
  if (a.id === 'wild' || b.id === 'wild' || c.id === 'wild') {
    const nonWild = [a,b,c].filter(x => x.id !== 'wild');
    if (nonWild.every(x => x.id === nonWild[0]?.id) && nonWild.length >= 1) {
      return bet * Math.floor((nonWild[0].p3 + SYMS.find(s => s.id==='wild').p3) / 2);
    }
  }
  return 0;
}

function spin() {
  if (spinning) return;
  const bet = Math.max(1, parseInt(document.getElementById('betAmt').value) || 10);
  const bal = Casino.getBalance();
  if (bet > bal) { showMsg('Insufficient balance', false); return; }
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('slotMsg').style.color = 'var(--text3)';
  document.getElementById('slotMsg').textContent = 'Spinning...';

  const result = getResult();
  const win = calcWin(result, bet);
  const durations = [1200, 1600, 2000];

  for (let r = 0; r < 3; r++) {
    animateReel(r, result[r], durations[r]);
  }

  setTimeout(() => {
    const newBal = Casino.recordBet('slots', bet, win);
    spinsPlayed++;
    if (win > 0) {
      winsCount++;
      if (win > bestWin) bestWin = win;
      showMsg(`WIN! +${Casino.fmt(win)} (${result[0].label} ${result[1].label} ${result[2].label})`, true);
      highlightMiddle();
    } else {
      showMsg(`${result[0].label} · ${result[1].label} · ${result[2].label}`, false);
    }
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    updateStats(newBal);
    Casino.updateBalance();
  }, 2200);
}

function animateReel(reelIdx, targetSymbol, duration) {
  const strip = document.getElementById('strip' + reelIdx);
  const cells = Array.from(strip.querySelectorAll('.reel-cell'));
  const totalCells = cells.length;

  // Build a new strip ending with 3 symbols centered on target
  const preSpinItems = [];
  for (let i = 0; i < 30; i++) preSpinItems.push(SYMS[Math.floor(Math.random() * SYMS.length)]);
  preSpinItems.push(weightedRandom()); // above target
  preSpinItems.push(targetSymbol);     // middle (payline)
  preSpinItems.push(weightedRandom()); // below target

  strip.innerHTML = preSpinItems.map(s =>
    `<div class="reel-cell"><div style="width:56px;height:56px">${s.svg}</div></div>`
  ).join('');

  const endY = -(preSpinItems.length - 3) * CELL_H + CELL_H; // show last 3
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(0)';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      strip.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.9, 0.25, 1)`;
      strip.style.transform = `translateY(${endY}px)`;
    });
  });
}

function highlightMiddle() {
  for (let r = 0; r < 3; r++) {
    const strip = document.getElementById('strip' + r);
    const cells = strip.querySelectorAll('.reel-cell');
    if (cells.length >= 2) cells[cells.length - 2].classList.add('highlighted');
  }
  setTimeout(() => {
    document.querySelectorAll('.reel-cell.highlighted').forEach(c => c.classList.remove('highlighted'));
  }, 1500);
}

function showMsg(txt, won) {
  const el = document.getElementById('slotMsg');
  el.textContent = txt;
  el.style.color = won ? 'var(--green)' : 'var(--text2)';
  if (won) el.classList.add('win-pop');
  setTimeout(() => el.classList.remove('win-pop'), 500);
}

function setBetAmt(v) {
  const bal = Casino.getBalance();
  document.getElementById('betAmt').value = Math.min(v, bal);
}

function adjustBet(mult) {
  const el = document.getElementById('betAmt');
  const bal = Casino.getBalance();
  el.value = Math.max(1, Math.min(Math.round(parseFloat(el.value) * mult), bal));
}

function updateStats(bal) {
  document.getElementById('st-balance').textContent = Casino.fmt(bal);
  document.getElementById('st-played').textContent = spinsPlayed;
  document.getElementById('st-won').textContent = winsCount;
  document.getElementById('st-bigwin').textContent = bestWin > 0 ? Casino.fmt(bestWin) : '—';
}

// Init
const prof = Casino.getProfile();
const sStats = prof.stats.slots;
spinsPlayed = sStats.played; winsCount = sStats.won;
document.getElementById('st-balance').textContent = Casino.fmt(prof.balance);
document.getElementById('st-played').textContent = spinsPlayed;
document.getElementById('st-won').textContent = winsCount;

buildStrips();
buildPaytable();
// Show initial reels in center position
for (let r = 0; r < 3; r++) {
  const s = document.getElementById('strip' + r);
  const cells = s.querySelectorAll('.reel-cell');
  const total = cells.length;
  s.style.transform = `translateY(${-(total - 3) * CELL_H + CELL_H}px)`;
}
</script>
</body>
</html>
